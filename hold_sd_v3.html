<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS Pro - 智能补件终端</title>
    
    <!-- Fonts: Inter, Noto Sans SC, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Three.js (Core & Controls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- SheetJS Excel Parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        bgBase: '#f5f5f7', 
                        glass: 'rgba(255, 255, 255, 0.7)',
                        brand: {
                            50: '#f0fdf4',   // 改为 Emerald 绿色系，贴合"补入/完成"的安全感
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    },
                    boxShadow: {
                        'glass': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'glow': '0 0 20px rgba(34, 197, 94, 0.4)',
                        'glow-orange': '0 0 20px rgba(249, 115, 22, 0.4)',
                    },
                    transitionTimingFunction: {
                        'spring': 'cubic-bezier(0.16, 1, 0.3, 1)',
                        'out-expo': 'cubic-bezier(0.19, 1, 0.22, 1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fafafa;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            overscroll-behavior-y: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            transition: box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-panel:hover {
            box-shadow: 0 20px 60px -15px rgba(0,0,0,0.08);
        }

        @keyframes float {
            0% { transform: translateY(0px) rotateX(10deg) rotateY(-10deg); }
            50% { transform: translateY(-5px) rotateX(15deg) rotateY(-5deg); }
            100% { transform: translateY(0px) rotateX(10deg) rotateY(-10deg); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        /* 手机横屏提示 */
        @keyframes phone-rotate {
            0%, 20% { transform: rotate(-90deg); }
            40%, 60% { transform: rotate(0deg); }
            80%, 100% { transform: rotate(-90deg); }
        }
        .animate-phone-rotate {
            animation: phone-rotate 2.5s ease-in-out infinite;
        }
        @media screen and (max-width: 1024px) and (orientation: landscape) and (pointer: coarse) {
            #landscape-overlay {
                display: flex !important;
            }
        }
        
        svg text { user-select: none; }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden text-slate-800 flex flex-col md:flex-row box-border relative select-none md:select-auto font-sans">

    <!-- 强制竖屏引导遮罩层 -->
    <div id="landscape-overlay" class="fixed inset-0 z-[9999] bg-slate-900/95 backdrop-blur-xl flex-col items-center justify-center text-white hidden transition-all duration-500">
        <div class="relative w-24 h-24 flex items-center justify-center mb-6">
            <div class="absolute inset-0 bg-brand-500 rounded-full opacity-20 animate-ping"></div>
            <i data-lucide="smartphone" class="w-14 h-14 text-brand-400 animate-phone-rotate"></i>
        </div>
        <h2 class="text-3xl font-black mb-2 tracking-tight">请竖屏操作</h2>
        <p class="text-slate-400 text-sm font-medium tracking-wide">为了获得最佳的作业体验，请旋转您的设备</p>
    </div>

    <!-- 隐藏的 File Input -->
    <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">

    <!-- Mobile Header -->
    <header class="md:hidden flex items-center justify-between px-5 py-3 glass-panel border-b border-white/50 z-30 shrink-0 relative">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-brand-400 shadow-lg shadow-slate-900/20">
                <i data-lucide="package-plus" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-black tracking-tight text-lg leading-none">WMS Pro</h1>
                <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mt-0.5">Terminal</p>
            </div>
        </div>
        <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-500 md:hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-500 ease-spring z-50 w-full md:w-[340px] h-full md:h-[calc(100dvh-3rem)] glass-panel border-r border-white/50 flex flex-col shrink-0 md:rounded-[2rem] md:my-6 md:ml-6 shadow-2xl md:shadow-glass">
        <div class="hidden md:flex p-7 pb-5 items-center gap-4 border-b border-slate-100/50">
            <div class="w-12 h-12 rounded-2xl bg-slate-900 flex items-center justify-center text-brand-400 shadow-xl shadow-slate-900/20">
                <i data-lucide="package-plus" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-black tracking-tighter text-2xl leading-none text-slate-900">WMS Pro</h1>
                <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1.5">Restock Terminal</p>
            </div>
        </div>

        <div class="md:hidden flex justify-between items-center p-6 border-b border-slate-200/50">
            <div class="font-bold text-slate-800 text-xs tracking-widest uppercase flex items-center gap-2">
                <i data-lucide="list-tree" class="w-4 h-4 text-brand-500"></i> 补件队列
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-slate-800 bg-slate-100 p-2.5 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div id="sidebar-content" class="flex-1 flex flex-col min-h-0 overflow-hidden px-5 md:px-7 py-6">
            <!-- Content injected by JS -->
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-area" class="flex-1 h-full flex flex-col p-3 md:p-6 relative z-10 overflow-hidden">
        <!-- Dashboard Container enforces strict single screen boundaries -->
        <section id="dashboard-container" class="flex-1 w-full h-full overflow-hidden relative">
            <!-- Content injected by JS -->
        </section>
    </main>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // 模拟零件数据库
        const PARTS_DB = [
            { name: "M3沉头螺丝", type: "螺丝" },
            { name: "M4防松螺母", type: "螺丝" },
            { name: "57步进电机", type: "电机" },
            { name: "主控板(V2)", type: "主板" },
            { name: "ESP32模块", type: "芯片" },
            { name: "608ZZ轴承", type: "轴承" },
            { name: "科技件-十字轴", type: "积木" },
            { name: "1x2 基础颗粒", type: "积木" }
        ];

        // 统一的柜号格式化工具
        const formatCabinetId = (id) => id.replace('S-', '小柜').replace('L-', '大柜');

        // 生成地图柜子数据
        const generateCabinets = () => {
            const cabinets = [];
            let partIndex = 0;
            const getPart = () => PARTS_DB[(partIndex++) % PARTS_DB.length];

            const createCab = (id, numId, type, x, y) => {
                const partsInCabinet = [];
                for(let i=0; i<3; i++) {
                    partsInCabinet.push({
                        ...getPart(),
                        row: Math.floor(Math.random() * (type==='large'?10:15)) + 1,
                        col: Math.floor(Math.random() * (type==='large'?3:5)) + 1,
                        stock: Math.floor(Math.random() * 100) + 10
                    });
                }
                const fullDisplayId = (type === 'large' ? '大柜' : '小柜') + numId;
                return { id, displayId: fullDisplayId, type, x, y, inventory: partsInCabinet, defaultPart: partsInCabinet[0].name };
            };

            const rightS = [
                { id: 20, y: 1 }, { id: 19, y: 2 }, { id: 18, y: 4 }, { id: 17, y: 5 }, 
                { id: 16, y: 6 }, { id: 15, y: 7 }, { id: 14, y: 9 }, { id: 13, y: 10 }, 
                { id: 12, y: 11 }, { id: 11, y: 12 }, { id: 10, y: 14 }, { id: 9, y: 15 }, 
                { id: 8, y: 16 }, { id: 7, y: 17 }, { id: 6, y: 19 }, { id: 5, y: 20 }, 
                { id: 4, y: 21 }, { id: 3, y: 22 }, { id: 2, y: 27 }, { id: 1, y: 28 }
            ];
            rightS.forEach(c => cabinets.push(createCab(`S-${c.id}`, `${c.id}`, 'small', 4, c.y)));

            for (let i = 1; i <= 10; i++) {
                cabinets.push(createCab(`L-${i}`, `${i}`, 'large', 0, 11 - i));
            }

            cabinets.push(createCab('S-21', '21', 'small', 0, 14));
            cabinets.push(createCab('S-22', '22', 'small', 0, 19));
            cabinets.push(createCab('S-23', '23', 'small', 0, 20));
            cabinets.push(createCab('S-24', '24', 'small', 0, 25));
            cabinets.push(createCab('S-25', '25', 'small', 0, 26));

            return cabinets;
        };

        const CABINETS = generateCabinets();
        const ENTRANCE = { x: 2, y: 30 };

        // 全局核心状态
        const state = { 
            pickingTasks: [], 
            listName: null,  
            isGuiding: false, 
            currentTaskIndex: 0, 
            mainView: 'cabinet',
            jobStartTime: null,
            completedReport: null,
            isPreloading: false,
            preloadProgress: 0,
            modelsPreloaded: false,
            alreadyCompletedMessage: null
        };

        const API_ENDPOINT = 'https://stateless.unity.cn/release/2e87e2f7-8488-4b42-9a17-a4dce04e1ec3/CloudPath';
        window.GlobalLocationCache = {};

        // ------------------ 纯前端模拟 API 延迟行为 ------------------
        
        // 模拟加载云端模型资源 (假动作)
        window.preloadAllModels = async () => {
            if (state.pickingTasks.length === 0) return;

            state.isPreloading = true;
            state.preloadProgress = 0;
            updateUI();

            const totalSteps = 20;
            for (let i = 1; i <= totalSteps; i++) {
                await new Promise(res => setTimeout(res, 50)); // 模拟网络延迟
                state.preloadProgress = Math.round((i / totalSteps) * 100);
                updateUI(); 
            }

            state.isPreloading = false;
            state.modelsPreloaded = true;
            updateUI();
        };

        // 生成用于展示的通用 3D 占位积木模型（完全不依赖外部请求）
        const generateFallbackModel = () => {
            const group = new THREE.Group();
            // 品牌绿配色质感
            const baseColor = new THREE.Color().setHSL(Math.random(), 0.7, 0.5);
            const brickMat = new THREE.MeshStandardMaterial({ 
                color: baseColor, 
                metalness: 0.2, 
                roughness: 0.3,
                clearcoat: 0.5
            });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 1), brickMat);
            group.add(body);
            for(let i of [-0.5, 0.5]) {
                const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.4, 16), brickMat);
                stud.position.set(i, 0.7, 0);
                group.add(stud);
            }
            
            // 居中自适应大小
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const wrapper = new THREE.Group();
            group.position.sub(center); 
            wrapper.add(group);

            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
                const scale = 2 / maxDim;
                wrapper.scale.set(scale, scale, scale);
            }
            return wrapper;
        };

        const extractFieldText = (fieldData) => {
            if (!fieldData) return '';
            if (typeof fieldData === 'string') return fieldData;
            if (Array.isArray(fieldData)) {
                return fieldData.map(item => typeof item === 'object' ? (item.text || '') : String(item)).join('');
            }
            if (typeof fieldData === 'object') return fieldData.text || '';
            return String(fieldData);
        };

        const fetchCloudLocations = async (partNames) => {
            if (!partNames || partNames.length === 0) return;
            const placeholders = partNames.map(() => '?').join(',');
            const query = `SELECT 颗粒名称, 位置, 柜体 FROM Design_Itempicker WHERE 颗粒名称 IN (${placeholders})`;
            
            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'dbOperation',
                        query: query,
                        queryParams: partNames
                    })
                });
                const data = await res.json();
                const records = data.data || data.result || [];
                
                records.forEach(record => {
                    const partName = record['颗粒名称'];
                    if (partName && (record['位置'] || record['柜体'])) {
                        window.GlobalLocationCache[partName] = {
                            loc: record['位置'] || '',
                            type: record['柜体'] || ''
                        };
                    }
                });
            } catch (e) {
                console.error("Fetch Locations Error:", e);
            }
        };

        const parseDbLocation = (cacheData) => {
            if (!cacheData || (!cacheData.loc && !cacheData.type)) return { cabId: '未分配', row: 0, col: 0, rawStr: '暂无库位信息' };
            const locStr = String(cacheData.loc).trim();
            const typeStr = String(cacheData.type).trim();
            const isLarge = typeStr === '大' || locStr.includes('大') || locStr.toUpperCase().startsWith('L');
            const nums = locStr.match(/\d+/g);
            if (nums && nums.length >= 3) {
                return { cabId: `${isLarge ? 'L' : 'S'}-${nums[0]}`, row: parseInt(nums[1]), col: parseInt(nums[2]), rawStr: `${isLarge ? '大柜' : '小柜'} ${locStr}` };
            }
            return { cabId: '未分配', row: 0, col: 0, rawStr: `位置异常: ${typeStr} ${locStr}` };
        };

        const fetchRecordFromURL = async (sdID) => {
            const container = document.getElementById('dashboard-container');
            if(container) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full glass-panel rounded-[2rem] animate-pulse">
                        <i data-lucide="cloud-download" class="w-12 h-12 text-brand-500 mb-4 opacity-80"></i>
                        <h3 class="text-xl font-black text-slate-800 tracking-tight mb-1">正在同步云端补件任务...</h3>
                        <p class="text-xs font-mono text-slate-400">关联任务: ${sdID}</p>
                    </div>
                `;
                lucide.createIcons();
            }

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'getRecords',
                        BitableUUID: 'BitableUUID085',
                        filter: {
                            conjunction: "and",
                            conditions: [{ field_name: "关联任务", operator: "is", value: [sdID] }]
                        }
                    })
                });

                const data = await response.json();
                
                if (data.code === 0 && data.data && data.data.items && data.data.items.length > 0) {
                    const record = data.data.items[0];
                    const status = extractFieldText(record.fields['完成情况']);
                    
                    if (status === '已完成') {
                        state.alreadyCompletedMessage = `关联任务 (sdID: ${sdID}) 的补件清单已被标记为已完成，无需重复作业。`;
                        updateUI();
                        return;
                    }

                    const taskDesc = extractFieldText(record.fields['任务描述']) || '';
                    const match = taskDesc.match(/补仓【(.*?)】/);
                    
                    if (match && match[1]) {
                        const rawParts = match[1].split(/[,，、\s]+/);
                        const uniqueParts = [...new Set(rawParts.filter(p => p.trim() !== ''))];
                        
                        await fetchCloudLocations(uniqueParts);

                        let newTasks = [];
                        uniqueParts.forEach(partName => {
                            const locData = window.GlobalLocationCache[partName];
                            const loc = parseDbLocation(locData);
                            newTasks.push({
                                id: Math.random().toString(36).substr(2),
                                cabinetId: loc.cabId,
                                rawInput: loc.rawStr,
                                quantity: 1, 
                                originalQuantity: 1,
                                row: loc.row,
                                col: loc.col,
                                partName: partName
                            });
                        });

                        if (newTasks.length > 0) {
                            state.pickingTasks = newTasks;
                            state.listName = `补仓任务单`;
                            state.modelsPreloaded = false;
                            state.isPreloading = false;
                            state.preloadProgress = 0;
                            updateUI();
                        } else {
                            alert('⚠️ 未能解析出有效的颗粒！');
                            updateUI();
                        }
                    } else {
                        alert('⚠️ 任务描述格式不正确，未找到类似 补仓【...】 的信息！');
                        updateUI();
                    }
                } else {
                    alert('⚠️ 未找到对应的补件任务记录或服务器返回异常！');
                    updateUI();
                }
            } catch (e) {
                console.error(e);
                alert('⚠️ 从云端获取数据失败，请检查网络连接。');
                updateUI();
            }
        };

        // 加载本地演示数据
        const loadDemoData = () => {
            state.pickingTasks = [
                { id: "1", cabinetId: "S-18", rawInput: "小柜18", quantity: 50, row: 2, col: 3, partName: "M3沉头螺丝" },
                { id: "2", cabinetId: "L-3", rawInput: "大柜3", quantity: 15, row: 5, col: 1, partName: "57步进电机" },
                { id: "3", cabinetId: "S-5", rawInput: "小柜5", quantity: 120, row: 12, col: 4, partName: "1x2 基础颗粒" },
                { id: "4", cabinetId: "未分配", rawInput: "无位置", quantity: 10, row: 0, col: 0, partName: "未知实验件" },
            ];
            state.listName = "Demo 补件任务清单 - 2026.03";
            state.modelsPreloaded = false;
            state.isPreloading = false;
            state.preloadProgress = 0;
            updateUI();
        };

        // 处理本地 Excel 上传
        const handleExcelUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                let newTasks = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    const qty = parseInt(row[1]) || 1;
                    const partName = row[2] || "未知颗粒";
                    const smallLoc = row[3];
                    const largeLoc = row[5];

                    let locStr = "";
                    let isLarge = false;

                    if (smallLoc && String(smallLoc).trim() !== "") {
                        locStr = String(smallLoc).trim();
                    } else if (largeLoc && String(largeLoc).trim() !== "") {
                        locStr = String(largeLoc).trim();
                        isLarge = true;
                    } else {
                        continue; 
                    }

                    const regex = /^(\d+)[柜-]?(\d+)-(\d+)$/;
                    const match = locStr.match(regex);
                    
                    if (match) {
                        const cabId = `${isLarge ? "L" : "S"}-${match[1]}`;
                        const cab = CABINETS.find(c => c.id === cabId);
                        if (cab) {
                            newTasks.push({
                                id: Math.random().toString(36).substr(2),
                                cabinetId: cabId,
                                rawInput: (isLarge ? '大柜' : '小柜') + locStr,
                                quantity: qty,
                                row: parseInt(match[2]),
                                col: parseInt(match[3]),
                                partName: partName
                            });
                        }
                    }
                }

                if (newTasks.length > 0) {
                    state.pickingTasks = newTasks;
                    state.listName = file.name;
                    state.modelsPreloaded = false;
                    state.isPreloading = false;
                    state.preloadProgress = 0;
                    updateUI();
                } else {
                    alert("⚠️ 未在文件中找到有效的位置数据！");
                }
                document.getElementById('excel-upload').value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        // ------------------ 3D 渲染器 ------------------
        let currentRenderSession = 0;
        let current3DAnimId = null;
        let currentRenderer = null;

        const init3DViewer = async (partName, type) => {
            const container = document.getElementById('part-3d-viewer');
            if(!container) return;

            const session = ++currentRenderSession;

            if(current3DAnimId) cancelAnimationFrame(current3DAnimId);
            if(currentRenderer) {
                currentRenderer.dispose();
                container.innerHTML = '';
            }

            const scene = new THREE.Scene();
            const isMobile = window.innerWidth < 768;
            const camera = new THREE.PerspectiveCamera(isMobile ? 35 : 40, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, isMobile ? 2.5 : 3.0, isMobile ? 4.5 : 5.0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);

        // ------------------ 地图与 UI 渲染 ------------------

        const getMapSvgHtml = () => {
            const mapConfig = { scale: 30, offsetX: 60, offsetY: 20 };

            let pathSvg = '';
            let activeTargets = [];

            if (state.isGuiding && state.pickingTasks.length > 0) {
                const currentTask = state.pickingTasks[state.currentTaskIndex];

                if (currentCab) {
                    hasSpecificTarget = true;
                    const tgtPos = toSvg(currentCab.x, currentCab.y);
                    targetCx = tgtPos.cx; targetCy = tgtPos.cy;

                    let startPointLog = { x: ENTRANCE.x, y: ENTRANCE.y };
                    if (state.currentTaskIndex > 0) {
                        const prevTask = state.pickingTasks[state.currentTaskIndex - 1];
                        const prevCab = CABINETS.find(c => c.id === prevTask.cabinetId);

                    }

                    const startPos = toSvg(startPointLog.x, startPointLog.y);
                    const mid1 = toSvg(2, startPointLog.y);
                    const mid2 = toSvg(2, currentCab.y);
                    const endPos = toSvg(currentCab.x > 2 ? currentCab.x - 1 : currentCab.x + 1, currentCab.y);

                    activeTargets.push({ ...currentCab, pulseColor: 'brand' });

                    pathSvg = `
                        <polyline points="${startPos.cx},${startPos.cy} ${mid1.cx},${mid1.cy} ${mid2.cx},${mid2.cy} ${endPos.cx},${endPos.cy}"

            const svgGrid = `<defs><pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.5" fill="#cbd5e1" /></pattern></defs><rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#dotGrid)" />`;
            const zonesSvg = `

            `;

            const cabinetsSvg = CABINETS.map(cab => {
                const pos = toSvg(cab.x, cab.y);
                const w = cab.type === 'large' ? 56 : 42; const h = cab.type === 'large' ? 26 : 20;
                const isTarget = activeTargets.find(t => t.id === cab.id);
                
                let textColor = cab.type === 'large' ? '#64748b' : '#334155';
                let rectAttrs = `fill="#ffffff" stroke="#cbd5e1" stroke-width="1"`;
                let textAttrs = `fill="${textColor}" font-weight="bold" font-size="${cab.type === 'large' ? '12' : '10'}"`;
                let pulseEffect = ""; let interactiveGroupOpen = `<g class="transition-all duration-300">`; let interactiveGroupClose = `</g>`;

                if (isTarget) {
                    rectAttrs = `fill="#f0fdf4" stroke="#22c55e" stroke-width="2"`;
                    textAttrs = `fill="#16a34a" font-weight="900" font-size="${cab.type === 'large' ? '14' : '11'}"`; 
                    pulseEffect = `<rect x="${pos.cx - w/2}" y="${pos.cy - h/2}" width="${w}" height="${h}" rx="3" fill="none" stroke="#4ade80" stroke-width="2"><animate attributeName="stroke-width" values="2; 8; 2" dur="1.5s" repeatCount="indefinite" /><animate attributeName="stroke-opacity" values="1; 0; 0" dur="1.5s" repeatCount="indefinite" /></rect>`;
                    interactiveGroupOpen = `<g class="cabinet-target cursor-pointer hover:opacity-80 transition-opacity">`;
                }

                return `${pulseEffect}${interactiveGroupOpen}<rect x="${pos.cx - w/2}" y="${pos.cy - h/2}" width="${w}" height="${h}" rx="4" ${rectAttrs} style="transition: all 0.3s;" /><text x="${pos.cx}" y="${pos.cy}" text-anchor="middle" dominant-baseline="central" pointer-events="none" ${textAttrs}>${cab.displayId}</text>${interactiveGroupClose}`;
            }).join('');

            return { innerHtml: `${svgGrid}${zonesSvg}${pathSvg}${cabinetsSvg}`, targetCx, targetCy, hasSpecificTarget };
        };

        const renderMap = () => {
            const container = document.getElementById('map-container');
            if(!container) return;
            const svgData = getMapSvgHtml();
            let svgEl = container.querySelector('svg');
            
            if (!svgEl) {
                container.innerHTML = `<svg width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="touch-action: none; user-select: none; -webkit-user-select: none;"></svg>`;
                svgEl = container.querySelector('svg');
                
                let startX, startY;
                svgEl.addEventListener('pointerdown', e => {
                    if (state.mainView !== 'map') return;
                    mapState.isDragging = true; mapState.lastX = e.clientX; mapState.lastY = e.clientY; startX = e.clientX; startY = e.clientY;
                    svgEl.setPointerCapture(e.pointerId); svgEl.style.cursor = 'grabbing'; svgEl.style.transition = 'none'; 
                });

                    if(!mapState.isDragging || state.mainView !== 'map') return;
                    const dx = e.clientX - mapState.lastX; const dy = e.clientY - mapState.lastY;
                    mapState.lastX = e.clientX; mapState.lastY = e.clientY;
                    const rect = svgEl.getBoundingClientRect();
                    mapState.viewBox.x -= dx * (mapState.viewBox.w / rect.width); mapState.viewBox.y -= dy * (mapState.viewBox.h / rect.height);
                    svgEl.setAttribute('viewBox', `${mapState.viewBox.x} ${mapState.viewBox.y} ${mapState.viewBox.w} ${mapState.viewBox.h}`);
                });

                    if (state.mainView !== 'map') return;

                                    return `
                                    <div class="grid grid-cols-12 px-3 py-3 md:px-4 md:py-4 items-center border-b border-slate-50 last:border-0 hover:bg-slate-50/50 rounded-2xl transition-colors">
                                        <div class="col-span-4 md:col-span-3 font-mono text-xs md:text-sm font-bold text-slate-600">${formatCabinetIdDisplay(t.cabinetId)} <span class="text-[9px] md:text-xs text-slate-400 font-normal hidden sm:inline">${t.cabinetId !== '未分配' ? `(${t.row}-${t.col})` : ''}</span></div>
                                        <div class="col-span-8 md:col-span-9 text-xs md:text-sm font-bold text-slate-800 truncate pr-2">${t.partName}</div>
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (state.isGuiding && state.pickingTasks.length > 0) {
                const task = state.pickingTasks[state.currentTaskIndex];
                let partInfo = PARTS_DB.find(p => p.name === task.partName) || { name: task.partName, type: "未知类型" };

                const isUnassigned = task.cabinetId === '未分配';
                const isLarge = task.cabinetId.startsWith('L-');
                const rows = isLarge ? 10 : 15, cols = isLarge ? 3 : 5;

                if (state.mainView === 'cabinet') {
                    const tasksInCabinet = state.pickingTasks.filter(t => t.cabinetId === task.cabinetId);

                    let gridHtml = ''; let gridStyle = '';
                    if (isUnassigned) {
                        gridHtml = `<div class="col-span-full flex flex-col items-center justify-center text-slate-400 h-full w-full py-8 text-center bg-white/50 rounded-2xl border-2 border-dashed border-slate-200"><i data-lucide="help-circle" class="w-12 h-12 mb-3 text-slate-300"></i><p class="text-sm font-black text-slate-500">无物理位置映射</p><p class="text-[10px] mt-1 font-bold">请人工核对或存放至溢出区</p></div>`;
                        gridStyle = `display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;`;
                    } else {
                        gridStyle = `display: grid; grid-template-rows: repeat(${rows}, minmax(0, 1fr)); grid-template-columns: repeat(${cols}, minmax(0, 1fr)); width: 100%; height: 100%; gap: 3px;`;
                        for(let r=1; r<=rows; r++) {
                            for(let c=1; c<=cols; c++) {
                                const isCurrentTarget = (r === task.row && c === task.col);
                                const relatedTasks = tasksInCabinet.filter(t => t.row === r && t.col === c);
                                const isOtherTarget = !isCurrentTarget && relatedTasks.length > 0;
                                
                                let cellClass = 'bg-slate-50/80 border border-slate-200/50 text-slate-300 text-[10px] md:text-xs font-medium rounded-lg';
                                let cellContent = '<span class="opacity-20">·</span>';

                                if (isCurrentTarget) {
                                    cellClass = 'bg-gradient-to-b from-brand-400 to-brand-500 text-white shadow-xl shadow-brand-500/40 scale-[1.1] z-10 font-black text-xs md:text-lg border border-white/80 ring-4 ring-brand-500/20 rounded-xl';
                                    cellContent = `${r}-${c}`;
                                } else if (isOtherTarget) {
                                    const isAllDone = relatedTasks.every(t => state.pickingTasks.findIndex(pt => pt.id === t.id) < state.currentTaskIndex);
                                    if (isAllDone) {
                                        cellClass = 'bg-slate-100 border border-slate-200 text-slate-400 text-[10px] md:text-xs font-bold opacity-60 rounded-lg';
                                    } else {
                                        cellClass = 'bg-indigo-50 border-2 border-indigo-300 text-indigo-500 text-[10px] md:text-xs font-bold shadow-sm z-0 rounded-lg';
                                    }
                                    cellContent = `${r}-${c}`;
                                }
                                gridHtml += `<div class="flex justify-center items-center font-mono transition-all duration-500 ${cellClass}">${cellContent}</div>`;
                            }
                        }
                    }

                    container.innerHTML = `
                        <div class="flex flex-col w-full h-full overflow-hidden">
                            <div class="flex flex-col-reverse md:flex-row gap-4 flex-1 min-h-0">
                                <!-- Left: Cabinet Grid -->
                                <div class="glass-panel rounded-[2rem] p-4 md:p-8 flex flex-col relative flex-1 min-h-0">
                                    <div class="flex justify-between items-start mb-4 md:mb-6 shrink-0">
                                        <div class="flex items-center gap-3 md:gap-4">
                                            <h3 class="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter">${formatCabinetIdDisplay(task.cabinetId)}</h3>
                                            <div class="bg-slate-100 text-slate-500 text-xs px-2.5 py-1 rounded-lg font-mono border border-slate-200 font-bold">${isUnassigned ? '<span class="text-amber-500">溢出区</span>' : `${rows}x${cols}`}</div>
                                        </div>
                                        <button onclick="switchMainView('map')" class="bg-white text-slate-700 px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 hover:bg-slate-50 transition border border-slate-200 shadow-sm hover:shadow" ${isUnassigned ? 'disabled style="opacity: 0.4; cursor: not-allowed;"' : ''}>
                                            <i data-lucide="map" class="w-4 h-4 text-brand-500"></i> 区域导航
                                        </button>
                                    </div>
                                    <div class="flex-1 bg-[#f8fafc]/50 rounded-2xl border border-slate-200 p-2 md:p-5 flex items-center justify-center overflow-hidden relative shadow-inner">
                                        <div class="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:20px_20px] pointer-events-none opacity-50"></div>
                                        <div class="z-10" style="${gridStyle}">${gridHtml}</div>
                                    </div>
                                </div>

                                <!-- Right: Info & Actions -->
                                <div class="flex flex-row md:flex-col gap-4 shrink-0 h-[180px] md:h-full md:w-[340px] w-full">
                                    <div class="glass-panel rounded-[2rem] flex flex-col items-center justify-center relative flex-1 min-w-0 bg-white/90 overflow-hidden shadow-sm">
                                        <div id="part-3d-viewer" class="w-full h-full absolute inset-0 z-10 cursor-grab active:cursor-grabbing"></div>
                                        <div class="absolute bottom-0 left-0 right-0 text-center z-20 pointer-events-none bg-gradient-to-t from-white via-white/80 to-transparent pt-10 pb-4">
                                            <h2 class="text-base md:text-2xl font-black text-slate-900 tracking-tight truncate px-3">${task.partName}</h2>
                                            <div class="text-[9px] md:text-xs text-brand-600 font-bold uppercase tracking-widest mt-1">${partInfo.type}</div>
                                        </div>
                                    </div>

                                    <div class="glass-panel rounded-[2rem] bg-slate-900 p-4 md:p-6 flex flex-col justify-between flex-1 min-w-0 relative shadow-2xl">
                                        <div class="absolute -inset-20 bg-brand-500 blur-[80px] opacity-20 pointer-events-none rounded-full"></div>
                                        
                                        <div class="text-center w-full flex-1 flex flex-col justify-center items-center relative z-10">
                                            <div class="w-16 h-16 md:w-20 md:h-20 bg-white/10 rounded-full flex items-center justify-center mb-4 border border-white/20 shadow-inner">
                                                <i data-lucide="package-check" class="w-8 h-8 md:w-10 md:h-10 text-brand-400"></i>
                                            </div>
                                            <div class="text-sm md:text-base font-bold text-slate-200 tracking-widest uppercase">请放入目标库位</div>
                                        </div>

                                        <div class="flex gap-3 w-full shrink-0 z-10 mt-3 md:mt-0">
                                            ${state.currentTaskIndex > 0 ? `
                                            <button onclick="prevGuidanceStep()" class="w-12 h-12 md:w-14 md:h-14 bg-slate-800 text-slate-300 rounded-[1.25rem] flex justify-center items-center hover:bg-slate-700 transition-colors shrink-0 border border-slate-700 active:scale-95">
                                                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                                            </button>
                                            ` : ''}
                                            <button onclick="nextGuidanceStep()" class="flex-1 h-12 md:h-14 bg-brand-500 text-white rounded-[1.25rem] font-black flex justify-center items-center gap-2 shadow-glow hover:bg-brand-400 transition-all text-sm md:text-base active:scale-95">
                                                完成并继续 <i data-lucide="arrow-right" class="w-5 h-5"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    setTimeout(() => init3DViewer(task.partName, partInfo.type), 50);

                } else {
                    container.innerHTML = `
                        <div class="w-full h-full relative glass-panel rounded-[2rem] overflow-hidden flex flex-col items-center bg-white/60">
                            <div class="absolute top-8 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur-xl text-white px-6 py-3.5 rounded-full flex items-center gap-2.5 shadow-2xl cursor-pointer hover:bg-slate-800 transition-transform hover:-translate-y-1 font-bold text-sm border border-slate-700" onclick="switchMainView('cabinet')">
                                <i data-lucide="undo-2" class="w-4 h-4 text-brand-400"></i> 返回柜面视图
                            </div>
                            <div class="absolute top-24 left-1/2 transform -translate-x-1/2 z-40 bg-white/90 backdrop-blur px-5 py-2 rounded-xl text-[10px] font-bold text-slate-500 shadow-sm border border-white text-center pointer-events-none tracking-widest uppercase">
                                自由拖拽与缩放 · 点击发光目标返回
                            </div>

                            <div class="absolute bottom-8 right-6 md:right-10 z-50 flex flex-col gap-4">
                                <button onclick="window.mapFocusCurrent()" class="w-12 h-12 bg-white text-slate-700 rounded-2xl shadow-xl border border-slate-100 flex items-center justify-center hover:bg-brand-50 hover:text-brand-600 transition-colors"><i data-lucide="crosshair" class="w-5 h-5"></i></button>
                                <div class="flex flex-col bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
                                    <button onclick="window.mapZoom(1)" class="w-12 h-12 flex items-center justify-center text-slate-700 hover:bg-brand-50 hover:text-brand-600 transition-colors border-b border-slate-100"><i data-lucide="plus" class="w-5 h-5"></i></button>
                                    <button onclick="window.mapZoom(-1)" class="w-12 h-12 flex items-center justify-center text-slate-700 hover:bg-brand-50 hover:text-brand-600 transition-colors"><i data-lucide="minus" class="w-5 h-5"></i></button>
                                </div>
                            </div>

                            <div class="flex-1 w-full h-full flex items-center justify-center relative z-10" id="map-container"></div>
                        </div>
                    `;
                }
            } 
            else {
                if (state.pickingTasks.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col md:flex-row gap-5 w-full h-full">
                            <div class="glass-panel rounded-[2rem] border-dashed border-2 border-slate-200 flex flex-col items-center justify-center text-slate-400 flex-1 min-h-[300px] bg-slate-50/50">
                                <i data-lucide="package-open" class="w-16 h-16 text-slate-300 mb-6"></i>
                                <h3 class="text-2xl font-black text-slate-800 mb-3 tracking-tight">准备开始补件</h3>
                                <p class="text-[10px] font-bold tracking-widest uppercase mb-8 text-slate-400">请导入含库位信息的 Excel 任务单</p>
                                <div class="flex gap-4">
                                    <button onclick="document.getElementById('excel-upload').click()" class="bg-slate-900 text-white px-8 py-3.5 rounded-2xl font-bold text-sm shadow-xl hover:bg-slate-800 transition-all flex items-center gap-2 hover:-translate-y-0.5">
                                        <i data-lucide="upload" class="w-4 h-4 text-brand-400"></i> 上传文件
                                    </button>
                                </div>
                            </div>
                            <div class="flex-1 w-full min-h-[300px] glass-panel rounded-[2rem] overflow-hidden flex items-center justify-center opacity-40 grayscale relative" id="map-container"></div>
                        </div>
                    `;
                } else {
                    let actionAreaHtml = '';
                    
                    if (state.isPreloading) {
                        actionAreaHtml = `
                            <div class="w-full max-w-sm mt-4">
                                <div class="flex justify-between items-center mb-2.5">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">资源校验进度</span>
                                    <span class="text-sm font-black text-brand-600">${state.preloadProgress}%</span>
                                </div>
                                <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                                    <div class="h-full bg-brand-500 rounded-full transition-all duration-300" style="width: ${state.preloadProgress}%"></div>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-4 text-center animate-pulse">正在构建 3D 模拟器与路线，请稍候...</p>
                            </div>
                        `;
                    } else if (state.modelsPreloaded) {
                        actionAreaHtml = `
                            <div class="flex flex-col items-center gap-4 w-full max-w-sm mt-4">
                                <div class="text-xs font-bold text-brand-600 bg-brand-50 px-5 py-2 rounded-xl flex items-center gap-2 border border-brand-100 shadow-sm"><i data-lucide="check-circle-2" class="w-4 h-4"></i> 资源校验完毕，随时可作业</div>
                                <button onclick="startGuidance()" class="w-full bg-slate-900 text-white px-10 py-4 rounded-2xl font-black text-lg shadow-xl shadow-slate-900/20 hover:bg-slate-800 transition-transform hover:-translate-y-1 flex justify-center items-center gap-2">
                                    <i data-lucide="play" class="w-5 h-5 text-brand-400"></i> 启动补件导航
                                </button>
                            </div>
                        `;
                    } else {
                        actionAreaHtml = `
                            <div class="flex flex-col gap-3 mt-6 w-full max-w-sm">
                                <button onclick="preloadAllModels()" class="w-full bg-white border border-slate-200 text-slate-700 px-6 py-4 rounded-2xl font-bold text-sm shadow-sm hover:bg-slate-50 transition-transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                                    <i data-lucide="box" class="w-4 h-4 text-brand-500"></i> 预载路线与资源 (推荐)
                                </button>
                                <button onclick="startGuidance()" class="w-full bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold text-sm shadow-xl shadow-slate-900/20 hover:bg-slate-800 transition-transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                                    <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i> 直接开始作业
                                </button>
                            </div>
                        `;
                    }

                    container.innerHTML = `
                        <div class="flex flex-col md:flex-row gap-5 w-full h-full">
                            <div class="glass-panel rounded-[2rem] border border-slate-100 flex flex-col items-center justify-center text-slate-600 flex-1 min-h-[300px] bg-white/50 px-6 py-10 shadow-sm">
                                <div class="w-20 h-20 bg-white rounded-[1.5rem] flex items-center justify-center mb-6 shadow-xl border border-slate-100 text-brand-500 transform -rotate-3">
                                    <i data-lucide="clipboard-list" class="w-10 h-10"></i>
                                </div>
                                <h3 class="text-2xl md:text-3xl font-black text-slate-900 mb-3 tracking-tight text-center">${state.listName || '已成功读取清单'}</h3>
                                <p class="text-xs font-medium text-slate-500 mb-2 text-center max-w-sm tracking-wide">解析完成，共包含 <span class="font-black text-slate-800">${state.pickingTasks.length}</span> 项待补入颗粒。</p>
                                ${actionAreaHtml}
                            </div>
                            <div class="flex-1 w-full min-h-[300px] glass-panel rounded-[2rem] overflow-hidden flex items-center justify-center opacity-95 relative shadow-sm" id="map-container"></div>
                        </div>
                    `;
                }
            }
        };

        const startGuidance = () => { 
            if(state.pickingTasks.length){ 
                // 排序：有位置的按位置顺序，无位置的排最后
                state.pickingTasks.sort((a, b) => {
                    if (a.cabinetId === '未分配' && b.cabinetId !== '未分配') return 1;
                    if (a.cabinetId !== '未分配' && b.cabinetId === '未分配') return -1;
                    if (a.cabinetId === '未分配' && b.cabinetId === '未分配') return 0;
                    const [typeA, numStrA] = a.cabinetId.split('-');
                    const [typeB, numStrB] = b.cabinetId.split('-');
                    if (typeA !== typeB) return typeA === 'S' ? -1 : 1; 
                    return parseInt(numStrA) - parseInt(numStrB);
                });

                state.isGuiding = true; state.currentTaskIndex = 0; state.mainView = 'cabinet'; state.jobStartTime = new Date(); 
                if(window.innerWidth < 768) toggleSidebar(); 
                updateUI(); setTimeout(scrollToActiveTask, 100); 
            } 
        };

        const scrollToActiveTask = () => {
            const container = document.getElementById('task-list-container');
            const activeItem = document.getElementById('active-task-item');
            if (container && activeItem) container.scrollTo({ top: activeItem.offsetTop - 40, behavior: 'smooth' });
        };
        
        const prevGuidanceStep = () => {
            if (state.currentTaskIndex > 0) { 
                state.currentTaskIndex--; 
                if (state.mainView === 'map') mapState.needsFocus = true;
                updateUI(); setTimeout(scrollToActiveTask, 50);
            }
        };

        const nextGuidanceStep = () => {
            if (state.currentTaskIndex < state.pickingTasks.length - 1) { 
                state.currentTaskIndex++; 
                if (state.mainView === 'map') mapState.needsFocus = true;
                updateUI(); setTimeout(scrollToActiveTask, 50);
            } else { 
                const endTime = new Date();
                const durationMs = endTime - state.jobStartTime;
                const mins = Math.floor(durationMs / 60000); const secs = Math.floor((durationMs % 60000) / 1000);
                const report = {
                    id: 'RST-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                    durationStr: `${mins}分${secs}秒`,
                    tasks: [...state.pickingTasks],
                };
                state.isGuiding = false; state.pickingTasks = []; state.listName = null;
                state.completedReport = report; state.mainView = 'report'; 
                updateUI(); 
            }
        };

        // 云端归档操作
        const closeReport = async () => {
            if (!state.completedReport) return;
            const btn = document.getElementById('archive-btn');
            if (btn) {
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 正在处理数据...`;
                btn.disabled = true;
                lucide.createIcons();
            }

            const urlParams = new URLSearchParams(window.location.search);
            const sdID = urlParams.get('sdID');

            if (sdID) {
                try {
                    const p1 = fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'updateRecord',
                            BitableUUID: 'BitableUUID085',
                            filter: { conjunction: "and", conditions: [{ field_name: "关联任务", operator: "is", value: [sdID] }] },
                            fields: { "完成情况": "已完成" }
                        })
                    });
                    
                    const p2 = fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'updateRecord',
                            BitableUUID: 'BitableUUID085',
                            filter: { conjunction: "and", conditions: [{ field_name: "任务ID", operator: "is", value: [sdID] }] },
                            fields: { "完成情况": "已完成" }
                        })
                    });

                    await Promise.all([p1, p2]);
                    alert("✅ 云端归档已完成！关联任务与任务ID均已标记为已完成。");
                } catch (e) {
                    console.error("Archive Error:", e);
                    alert("❌ 云端更新失败，请检查网络！");
                    if (btn) {
                        btn.innerHTML = `<i data-lucide="database-zap" class="w-4 h-4"></i> 完成并归档`;
                        btn.disabled = false;
                        lucide.createIcons();
                    }
                    return;
                }
            } else {
                // 模拟 1 秒的网络请求延迟
                await new Promise(res => setTimeout(res, 1000));
                alert("✅ 本地归档已完成！(因URL无sdID，未执行云端更新)");
            }

            state.completedReport = null;
            state.mainView = 'cabinet';
            updateUI();
        };

        // ------------------ 移动端全局手势滑动控制 ------------------
        let touchStartY = 0; let touchStartX = 0; let swipeTarget = null;
        document.addEventListener('touchstart', (e) => {
            if (e.changedTouches.length > 0) {
                touchStartY = e.changedTouches[0].screenY; touchStartX = e.changedTouches[0].screenX; swipeTarget = e.target;
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (!state.isGuiding || state.mainView !== 'cabinet') return;
            if (swipeTarget && (swipeTarget.closest('#part-3d-viewer') || swipeTarget.closest('#task-list-container'))) return;

            if (e.changedTouches.length > 0) {
                let deltaY = touchStartY - e.changedTouches[0].screenY;
                let deltaX = Math.abs(touchStartX - e.changedTouches[0].screenX);
                if (Math.abs(deltaY) > 50 && Math.abs(deltaY) > deltaX) {
                    deltaY < 0 ? prevGuidanceStep() : nextGuidanceStep();
                }
            }
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', () => { 
            const urlParams = new URLSearchParams(window.location.search);
            const sdID = urlParams.get('sdID');
            if (sdID) {
                fetchRecordFromURL(sdID);
            } else {
                updateUI(); 
            }
        });

    </script>
</body>
</html>
