<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WMS Pro - V11 交互修复版</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        (function() {
            const scripts = [
                "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js",
                "https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"
            ];
            let i = 0;
            function loadNext() {
                if (i >= scripts.length) { window.dispatchEvent(new Event('WMSDepsLoaded')); return; }
                const s = document.createElement('script'); s.src = scripts[i++]; s.onload = loadNext; document.head.appendChild(s);
            }
            loadNext();
        })();

        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'Noto Sans SC'], mono: ['JetBrains Mono'] }, colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' } } } }
        }
    </script>

    <style>
        body { background-color: #fafafa; overflow: hidden; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        #cabinet-wall-container {
            width: 120vw; height: 120vh;
            position: absolute; left: -10vw; top: -10vh; 
            transform-style: preserve-3d;
            will-change: transform;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .swipe-container { position: absolute; inset: 0; overflow: hidden; perspective: 2000px; transform-style: preserve-3d; }
        .swipe-slide { position: absolute; inset: 0; transform-style: preserve-3d; }

        .cabinet-grid { 
            display: grid; gap: 12px; width: 100%; height: 100%; 
            padding: 15vh 10vw; transform-style: preserve-3d; align-content: center;
        }
        
        .grid-cell {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono'; font-size: 14px; color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.6); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .grid-cell.active { background: transparent; border-color: transparent; z-index: 50; }
        .grid-cell.active .drawer-box { transform: translateZ(80px); opacity: 1; }

        .drawer-box {
            position: absolute; inset: -1px; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0;
        }
        
        .drawer-front {
            position: absolute; inset: 0; background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 900; box-shadow: 0 20px 40px -10px rgba(99,102,241,0.5);
            transform: translateZ(2px);
        }

        .dynamic-ui {
            --ui-x: 0px; --ui-y: 0px; --anim-scale: 1;
            transform: translate(var(--ui-x), var(--ui-y)) scale(var(--anim-scale));
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .interactive-btn { transition: all 0.3s ease; }
        .interactive-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="h-[100dvh] w-screen flex relative select-none">

    <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">

    <button onclick="toggleSidebar()" class="fixed top-6 left-6 z-[100] w-12 h-12 rounded-2xl bg-white shadow-xl flex items-center justify-center text-slate-700 interactive-btn">
        <i data-lucide="menu"></i>
    </button>

    <button id="toggle-map-btn" onclick="toggleMainView()" class="fixed top-6 right-6 z-[100] w-12 h-12 rounded-2xl bg-white shadow-xl flex items-center justify-center text-slate-700 interactive-btn">
        <i data-lucide="map"></i>
    </button>

    <aside id="main-sidebar" class="fixed left-0 top-0 bottom-0 w-[320px] p-8 pt-24 z-[90] bg-white/80 backdrop-blur-3xl border-r border-white/60 shadow-2xl transition-transform duration-500 -translate-x-full">
        <h1 class="font-black text-2xl mb-8">WMS Pro</h1>
        <div id="task-list-container" class="space-y-3 overflow-y-auto max-h-[70vh] no-scrollbar"></div>
    </aside>

    <main class="flex-1 relative overflow-hidden">
        <div id="view-2d-map" class="absolute inset-0 z-50 bg-[#fafafa] flex items-center justify-center transition-opacity duration-500">
            <div id="map-container" class="w-full h-full"></div>
            <div id="empty-state-overlay" class="absolute inset-0 flex items-center justify-center bg-white/60 backdrop-blur-md">
                <button onclick="document.getElementById('excel-upload').click()" class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold shadow-2xl">导入清单</button>
            </div>
            <div id="start-job-overlay" class="absolute bottom-12 inset-x-0 hidden flex flex-col items-center gap-4">
                <button onclick="startGuidance()" class="bg-brand-600 text-white px-12 py-5 rounded-full font-black shadow-2xl scale-110">启动作业</button>
            </div>
        </div>

        <div id="view-3d-picking" class="absolute inset-0 z-20 hidden">
            <div id="cabinet-wall-container">
                <div id="swipe-layer-current" class="swipe-slide"></div>
                <div id="swipe-layer-next" class="swipe-slide hidden"></div>
            </div>
            
            <div id="layer2-3d-hologram" class="absolute inset-0 z-30 flex items-center justify-center pointer-events-none dynamic-ui">
                <div id="part-3d-viewer" class="w-full h-full pointer-events-auto"></div>
            </div>

            <div class="absolute right-8 bottom-24 z-50 flex flex-col gap-4">
                <button onclick="adjustQuantity(1)" class="w-14 h-14 bg-white rounded-full shadow-lg flex items-center justify-center"><i data-lucide="plus"></i></button>
                <button onclick="adjustQuantity(-1)" class="w-14 h-14 bg-white rounded-full shadow-lg flex items-center justify-center"><i data-lucide="minus"></i></button>
            </div>
        </div>
    </main>

    <script>
        const state = { pickingTasks: [], currentTaskIndex: -1, mainView: 'map', isGuiding: false };
        const viewer3D = { scene: null, camera: null, renderer: null, controls: null, activeWrapper: null };
        
        let targetWallRotX = 8, targetWallRotY = -18, targetWallOffsetX = 0, targetWallOffsetY = 0;
        let curWallRotX = 8, curWallRotY = -18, curWallOffsetX = 0, curWallOffsetY = 0;

        // --- 核心修复 1: 3D 交互 ---
        const setupInteractions = () => {
            const view3D = document.getElementById('view-3d-picking');
            let startY = 0, startT = 0;

            view3D.addEventListener('touchstart', e => {
                startY = e.touches[0].clientY;
                startT = Date.now();
                if (viewer3D.controls) viewer3D.controls.enabled = true;
            }, { passive: true });

            view3D.addEventListener('touchend', e => {
                const dy = startY - e.changedTouches[0].clientY;
                const dt = Date.now() - startT;
                // 判定为垂直快速滑动则切页
                if (dt < 300 && Math.abs(dy) > 100) {
                    dy > 0 ? nextGuidanceStep() : prevGuidanceStep();
                }
            }, { passive: true });
        };

        // --- 核心修复 2: 强制居中算法 ---
        const adjustCabinetWallPosition = () => {
            const activeCell = document.querySelector('.grid-cell.active');
            if (!activeCell) return;
            const cabGrid = activeCell.closest('.cabinet-grid');
            const rect = cabGrid.getBoundingClientRect();
            const cellRect = activeCell.getBoundingClientRect();

            const relX = (cellRect.left + cellRect.width / 2 - rect.left) / rect.width;
            const relY = (cellRect.top + cellRect.height / 2 - rect.top) / rect.height;

            const isMobile = window.innerWidth < 768;
            // 极大化补偿，确保不管格子在哪，都能拉到屏幕正中
            targetWallOffsetX = (0.5 - relX) * (isMobile ? 180 : 100);
            targetWallOffsetY = (0.5 - relY) * (isMobile ? 220 : 120);

            // 同时也移动 3D 模型投影位置
            const holo = document.getElementById('layer2-3d-hologram');
            const tx = (0.5 - relX) * (isMobile ? window.innerWidth * 0.8 : window.innerWidth * 0.4);
            const ty = (0.5 - relY) * (isMobile ? window.innerHeight * 0.5 : 0);
            holo.style.setProperty('--ui-x', `${tx}px`);
            holo.style.setProperty('--ui-y', `${ty}px`);
        };

        // --- 核心修复 3: 陀螺仪节流 ---
        let lastGyro = 0;
        const handleDeviceOrientation = (e) => {
            const now = Date.now();
            if (now - lastGyro < 16) return; // 锁定 60fps
            lastGyro = now;

            if (state.mainView !== 'cabinet') return;
            // 限制范围并增加平滑度
            targetWallRotY = -18 + (Math.max(-30, Math.min(30, e.gamma)) / 30) * 40;
            targetWallRotX = 8 - (Math.max(-30, Math.min(30, e.beta - 45)) / 30) * 30;
        };

        // 三维动画循环
        const animate = () => {
            requestAnimationFrame(animate);
            TWEEN.update();
            
            // 平滑追踪目标值
            curWallRotX += (targetWallRotX - curWallRotX) * 0.1;
            curWallRotY += (targetWallRotY - curWallRotY) * 0.1;
            curWallOffsetX += (targetWallOffsetX - curWallOffsetX) * 0.1;
            curWallOffsetY += (targetWallOffsetY - curWallOffsetY) * 0.1;

            const wall = document.getElementById('cabinet-wall-container');
            if (wall) {
                wall.style.transform = `rotateX(${curWallRotX}deg) rotateY(${curWallRotY}deg) translateX(${curWallOffsetX}vw) translateY(${curWallOffsetY}vh) translateZ(-50px)`;
            }

            if (viewer3D.renderer && viewer3D.scene) {
                if (viewer3D.controls) viewer3D.controls.update();
                viewer3D.renderer.render(viewer3D.scene, viewer3D.camera);
            }
        };

        // 基础逻辑 (精简版)
        const init3D = () => {
            const container = document.getElementById('part-3d-viewer');
            viewer3D.scene = new THREE.Scene();
            viewer3D.camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 1000);
            viewer3D.camera.position.set(0, 5, 20);
            viewer3D.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            viewer3D.renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(viewer3D.renderer.domElement);
            viewer3D.controls = new THREE.OrbitControls(viewer3D.camera, viewer3D.renderer.domElement);
            viewer3D.controls.autoRotate = true;
            viewer3D.scene.add(new THREE.AmbientLight(0xffffff, 1));
            animate();
        };

        const handleExcelUpload = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const workbook = XLSX.read(evt.target.result, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);
                state.pickingTasks = rows.map(r => ({
                    partName: r['颗粒名称'] || '未知物品',
                    quantity: r['取出数量'] || 1,
                    cabinetId: 'S-1', // 简化演示
                    row: 3, col: 2, // 简化演示
                    displayCab: '小柜1'
                }));
                document.getElementById('empty-state-overlay').classList.add('hidden');
                document.getElementById('start-job-overlay').classList.remove('hidden');
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        const startGuidance = () => {
            state.isGuiding = true;
            state.currentTaskIndex = 0;
            switchMainView('cabinet');
            renderTask();
            window.addEventListener('deviceorientation', handleDeviceOrientation);
        };

        const renderTask = () => {
            const task = state.pickingTasks[state.currentTaskIndex];
            const container = document.getElementById('swipe-layer-current');
            // 渲染格子的 HTML (简略版)
            let gridHtml = `<div class="cabinet-grid" style="grid-template-columns: repeat(5, 1fr);">`;
            for(let i=0; i<50; i++) {
                const isActive = i === 12; // 模拟 3-2 位置
                gridHtml += `<div class="grid-cell ${isActive?'active':''}">
                    ${isActive ? '<div class="drawer-box"><div class="drawer-front">3-2</div></div>' : i}
                </div>`;
            }
            gridHtml += `</div>`;
            container.innerHTML = gridHtml;
            
            setTimeout(() => {
                adjustCabinetWallPosition();
                update3DModel(task.partName);
            }, 100);
        };

        const update3DModel = (name) => {
            if (viewer3D.activeWrapper) viewer3D.scene.remove(viewer3D.activeWrapper);
            const geometry = new THREE.BoxGeometry(5, 5, 5);
            const material = new THREE.MeshStandardMaterial({ color: 0x6366f1 });
            const mesh = new THREE.Mesh(geometry, material);
            viewer3D.activeWrapper = mesh;
            viewer3D.scene.add(mesh);
        };

        const switchMainView = (v) => {
            state.mainView = v;
            document.getElementById('view-2d-map').classList.toggle('hidden', v === 'cabinet');
            document.getElementById('view-3d-picking').classList.toggle('hidden', v === 'map');
        };

        const nextGuidanceStep = () => { if(state.currentTaskIndex < state.pickingTasks.length-1) { state.currentTaskIndex++; renderTask(); } };
        const prevGuidanceStep = () => { if(state.currentTaskIndex > 0) { state.currentTaskIndex--; renderTask(); } };
        const toggleSidebar = () => { document.getElementById('main-sidebar').classList.toggle('-translate-x-full'); };

        window.addEventListener('WMSDepsLoaded', () => {
            init3D();
            setupInteractions();
            lucide.createIcons();
        });
    </script>
</body>
</html>
