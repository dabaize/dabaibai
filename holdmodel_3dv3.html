<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WMS Pro - 极致玻璃拟态版</title>
    
    <!-- 顶级无衬线排版字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <!-- 顺序依赖加载器 (包含 Three.js 及周边扩展) -->
    <script>
        (function() {
            const scripts = [
                "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js",
                "https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"
            ];
            
            let i = 0;
            function loadNext() {
                if (i >= scripts.length) {
                    window.dispatchEvent(new Event('WMSDepsLoaded'));
                    return;
                }
                const s = document.createElement('script');
                s.src = scripts[i++];
                s.onload = loadNext;
                document.head.appendChild(s);
            }
            loadNext();
        })();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: { 
                        brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>

    <style>
        /* 极致的基础设定与滚动控制 */
        body { 
            background-color: #fafafa; 
            overflow: hidden; 
            overscroll-behavior-y: none; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .swipe-container { position: absolute; inset: 0; overflow: hidden; perspective: 2000px; transform-style: preserve-3d; }
        .swipe-slide { position: absolute; inset: 0; transform-style: preserve-3d; }

        /* 3D 柜体容器 */
        #cabinet-wall-container {
            width: 120vw; height: 120vh;
            position: absolute; left: -10vw; top: -10vh; 
            transform-style: preserve-3d;
            transform: rotateX(8deg) rotateY(-18deg) translateZ(-50px) translateY(0vh);
            will-change: transform; /* 性能优化：启用 GPU 硬件加速层 */
        }

        .cabinet-grid { 
            display: grid; 
            gap: clamp(8px, 2.5vw, 18px); 
            width: 100%; height: 100%; 
            padding: 12vh 6vw 15vh; 
            transform-style: preserve-3d; position: relative;
            align-content: center;
        }
        @media (min-width: 640px) {
            .cabinet-grid { padding: 15vh 12vw 15vh; }
        }
        
        /* 玻璃拟态格子，Vercel 级阴影与透明度 */
        .grid-cell {
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: clamp(8px, 2vw, 16px); 
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace; 
            font-size: clamp(12px, 3.5vw, 15px); 
            font-weight: 700; color: #94a3b8;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; z-index: 2; 
            transform: translateZ(0); 
        }
        
        .grid-cell.picked {
            background: rgba(255, 255, 255, 0.15); color: transparent;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            border: 1px dashed rgba(148, 163, 184, 0.3); opacity: 0.6; z-index: 1;
        }
        
        .grid-cell.picked > div.absolute {
            transform: translateZ(1px);
        }

        .drawer-box {
            position: absolute; inset: -1px; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0); pointer-events: none; opacity: 0;
            will-change: transform;
        }
        
        .grid-cell.active { background: transparent; box-shadow: none; border-color: transparent; z-index: 50; }
        .grid-cell.active .drawer-box { transform: translateZ(clamp(60px, 15vw, 100px)); opacity: 1; }
        
        /* Stripe 质感渐变与阴影 */
        .drawer-front {
            position: absolute; inset: 0; 
            background: linear-gradient(135deg, #6366f1, #4f46e5); color: white;
            border-radius: clamp(8px, 2vw, 16px); 
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(18px, 6vw, 28px); font-weight: 900; 
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 20px 40px -10px rgba(99,102,241,0.6);
            transform: translateZ(2px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .drawer-top, .drawer-bottom, .drawer-left, .drawer-right { position: absolute; background: #4338ca; }
        
        .drawer-top { top: 0; left: 8px; right: 8px; height: clamp(60px, 15vw, 100px); transform-origin: top; transform: rotateX(-90deg); background: linear-gradient(to bottom, #4f46e5, #4338ca); border-radius: 8px 8px 0 0;}
        .drawer-bottom { bottom: 0; left: 8px; right: 8px; height: clamp(60px, 15vw, 100px); transform-origin: bottom; transform: rotateX(90deg); background: #312e81; box-shadow: 0 40px 60px -10px rgba(0,0,0,0.5); }
        .drawer-left { top: 8px; bottom: 8px; left: 0; width: clamp(60px, 15vw, 100px); transform-origin: left; transform: rotateY(90deg); }
        .drawer-right { top: 8px; bottom: 8px; right: 0; width: clamp(60px, 15vw, 100px); transform-origin: right; transform: rotateY(-90deg); }

        .path-svg { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; transform: translateZ(-2px); }
        @keyframes flowGlow { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
        .flowing-path { animation: flowGlow 1.2s linear infinite; }

        /* 模型交互区：高渲染清晰度 */
        #part-3d-viewer canvas { 
            filter: drop-shadow(0 40px 40px rgba(0,0,0,0.15)); 
            transform-origin: center bottom;
        }

        .sidebar-collapse { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        svg text { user-select: none; }

        .dynamic-ui {
            --ui-x: 0px;
            --ui-y: 0px;
            --anim-y: 0px;
            --anim-scale: 1;
            transform: translate(var(--ui-x), calc(var(--ui-y) + var(--anim-y))) scale(var(--anim-scale));
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out;
        }
        
        /* 交互微动效 - Linear 风格弹簧压感 */
        .interactive-btn {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .interactive-btn:active {
            transform: scale(0.92) translateY(2px);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex relative select-none">

    <!-- 隐藏的文件上传域 -->
    <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">

    <!-- 移动端侧边栏遮罩 -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[85] hidden opacity-0 transition-opacity duration-500 lg:hidden"></div>

    <!-- 侧边栏 Toggle 按钮 -->
    <button onclick="toggleSidebar()" class="fixed top-5 left-4 sm:top-6 sm:left-6 z-[100] w-12 h-12 rounded-[1.2rem] bg-white/80 backdrop-blur-2xl shadow-[0_12px_40px_-8px_rgba(0,0,0,0.08),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 flex items-center justify-center text-slate-700 hover:shadow-[0_16px_50px_-10px_rgba(0,0,0,0.12)] hover:-translate-y-1 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] pointer-events-auto group interactive-btn">
        <i data-lucide="menu" id="sidebar-icon" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
    </button>

    <!-- 视图切换按钮 -->
    <button id="toggle-map-btn" onclick="toggleMainView()" class="fixed top-5 right-4 sm:top-6 sm:right-6 z-[100] w-12 h-12 rounded-[1.2rem] bg-white/80 backdrop-blur-2xl border border-white/60 shadow-[0_12px_40px_-8px_rgba(0,0,0,0.08),inset_0_1px_1px_rgba(255,255,255,1)] flex items-center justify-center text-slate-700 hover:shadow-[0_16px_50px_-10px_rgba(0,0,0,0.12)] hover:-translate-y-1 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] pointer-events-auto group interactive-btn">
        <i data-lucide="map" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
    </button>

    <!-- 空间导航路径指示器 -->
    <div id="cabinet-pipeline" class="fixed top-[4.5rem] sm:top-6 left-1/2 transform -translate-x-1/2 z-[80] flex items-center gap-2 max-w-[90vw] sm:max-w-[65vw] overflow-x-auto no-scrollbar py-2 px-2 opacity-0 pointer-events-none transition-all duration-500"></div>

    <!-- 侧边栏列表：高质感毛玻璃 -->
    <aside id="main-sidebar" class="fixed left-0 top-0 bottom-0 w-[300px] sm:w-[340px] p-5 sm:p-7 pt-24 sm:pt-28 z-[90] bg-white/50 backdrop-blur-3xl border-r border-white/60 shadow-[20px_0_60px_-20px_rgba(0,0,0,0.08)] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] sidebar-collapse flex flex-col">
        <div class="px-2 pb-6 flex items-center gap-4 shrink-0">
            <div class="w-12 h-12 rounded-[1.2rem] bg-gradient-to-br from-slate-800 to-black shadow-[0_12px_24px_-6px_rgba(0,0,0,0.4),inset_0_1px_1px_rgba(255,255,255,0.2)] flex items-center justify-center text-white">
                <i data-lucide="layers" class="w-6 h-6"></i>
            </div>
            <h1 class="font-black text-2xl text-slate-900 tracking-tighter">WMS Pro</h1>
        </div>
        
        <div class="px-2 py-4 mb-4 shrink-0">
            <div class="flex justify-between items-end mb-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                <span>总作业进度</span><span class="text-brand-600 font-mono text-xs" id="sidebar-progress-text">0 / 0</span>
            </div>
            <div class="w-full bg-slate-200/50 shadow-inner h-2.5 rounded-full overflow-hidden p-[2px] border border-white/50">
                <div id="sidebar-progress-bar" class="bg-gradient-to-r from-brand-400 to-brand-600 h-full rounded-full transition-all duration-500 ease-out shadow-[0_0_12px_rgba(99,102,241,0.6)]" style="width: 0%"></div>
            </div>
        </div>

        <div id="task-list-container" class="flex-1 overflow-y-auto no-scrollbar space-y-3 px-1 pb-10"></div>
    </aside>

    <main class="flex-1 h-full relative z-10 flex flex-col overflow-hidden">
        <!-- 2D 鸟瞰地图层 -->
        <div id="view-2d-map" class="absolute inset-0 z-50 bg-[#fafafa] flex flex-col items-center justify-center transition-opacity duration-500">
            <!-- 缩放与聚焦浮层控件 -->
            <div class="absolute bottom-10 right-6 sm:bottom-12 sm:right-12 z-50 flex flex-col gap-4">
                <button onclick="window.mapFocusCurrent()" class="w-12 h-12 sm:w-14 sm:h-14 bg-white/90 backdrop-blur-2xl text-slate-700 rounded-full shadow-[0_12px_40px_-8px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 flex items-center justify-center hover:text-brand-600 hover:-translate-y-1 transition-all duration-500 ease-out pointer-events-auto interactive-btn group" title="重新聚焦"><i data-lucide="crosshair" class="w-5 h-5 group-active:scale-90"></i></button>
                <div class="flex flex-col bg-white/90 backdrop-blur-2xl rounded-[1.2rem] sm:rounded-[1.5rem] shadow-[0_12px_40px_-8px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 overflow-hidden pointer-events-auto">
                    <button onclick="window.mapZoom(1)" class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center text-slate-700 hover:text-brand-600 hover:bg-slate-50/50 transition-all duration-300 group interactive-btn"><i data-lucide="plus" class="w-5 h-5 group-active:scale-90"></i></button>
                    <div class="w-full h-[1px] bg-slate-100/50"></div>
                    <button onclick="window.mapZoom(-1)" class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center text-slate-700 hover:text-brand-600 hover:bg-slate-50/50 transition-all duration-300 group interactive-btn"><i data-lucide="minus" class="w-5 h-5 group-active:scale-90"></i></button>
                </div>
            </div>
            
            <div id="map-container" class="w-full h-full relative z-10 flex items-center justify-center"></div>

            <!-- 极简高质感的空状态浮层 -->
            <div id="empty-state-overlay" class="absolute inset-0 flex items-center justify-center z-20 backdrop-blur-xl bg-[#fafafa]/60 transition-all duration-500 pointer-events-auto px-4">
                <div class="bg-white/80 backdrop-blur-3xl shadow-[0_40px_100px_-20px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 rounded-[2rem] sm:rounded-[2.5rem] p-8 sm:p-12 flex flex-col items-center max-w-[90%] sm:max-w-md w-full hover:-translate-y-2 transition-transform duration-700 ease-[cubic-bezier(0.16,1,0.3,1)]">
                    <div class="w-20 h-20 rounded-[1.5rem] bg-gradient-to-b from-indigo-50 to-indigo-100/50 shadow-[inset_0_2px_4px_rgba(255,255,255,0.8),_0_10px_20px_-5px_rgba(99,102,241,0.15)] border border-white flex items-center justify-center text-brand-500 mb-8">
                        <i data-lucide="file-spreadsheet" class="w-10 h-10"></i>
                    </div>
                    <h2 class="text-2xl font-black text-slate-900 mb-3 tracking-tighter text-center">导入拣货清单</h2>
                    <p class="text-[11px] text-slate-400 font-bold mb-10 uppercase tracking-widest text-center">请上传带有位置信息的 Excel 文件</p>
                    <button onclick="document.getElementById('excel-upload').click()" class="w-full bg-slate-900 text-white py-4.5 rounded-[1.2rem] font-bold text-sm tracking-wide shadow-[0_15px_30px_-10px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.2)] hover:shadow-[0_20px_40px_-12px_rgba(0,0,0,0.4)] hover:-translate-y-1 active:scale-[0.98] transition-all duration-500 flex justify-center items-center gap-2">
                        <i data-lucide="upload" class="w-4 h-4"></i> 选择并解析文件
                    </button>
                </div>
            </div>

            <!-- 开始作业的大按钮浮层 -->
            <div id="start-job-overlay" class="absolute inset-x-0 bottom-8 sm:bottom-12 z-50 hidden pointer-events-auto flex flex-col items-center justify-end gap-4 px-4">
                
                <!-- 3D 模型预加载控制面板 -->
                <div id="preload-panel" class="w-full max-w-[90%] sm:max-w-md bg-white/80 backdrop-blur-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 rounded-[1.5rem] p-5 flex flex-col gap-4 transform translate-y-4 opacity-0 transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] delay-100">
                    <div class="flex justify-between items-center px-1">
                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="box" class="w-3.5 h-3.5"></i> 空间资产缓存</span>
                        <span id="preload-status-text" class="text-xs font-mono font-black text-brand-600">0 / 0</span>
                    </div>
                    <div class="w-full bg-slate-200/50 rounded-full h-2.5 overflow-hidden border border-white/50 shadow-inner">
                        <div id="preload-progress-bar" class="bg-gradient-to-r from-brand-400 to-brand-600 h-full w-0 transition-all duration-300 ease-out shadow-[0_0_10px_rgba(99,102,241,0.5)]"></div>
                    </div>
                    <button id="btn-preload" onclick="startPreload()" class="w-full bg-indigo-50 text-brand-600 py-3.5 rounded-[1rem] font-bold text-sm hover:bg-indigo-100 hover:-translate-y-0.5 active:scale-[0.98] transition-all flex items-center justify-center gap-2 border border-indigo-100">
                        <i data-lucide="cloud-download" class="w-4 h-4"></i> 开始预加载所有模型，拒绝卡顿
                    </button>
                </div>

                <button onclick="startGuidance()" class="w-full max-w-[90%] sm:max-w-md bg-slate-900 text-white py-4.5 sm:py-5 rounded-[2rem] text-base sm:text-lg font-black tracking-tight shadow-[0_20px_40px_-10px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.2)] hover:shadow-[0_30px_60px_-15px_rgba(0,0,0,0.4)] hover:-translate-y-1.5 active:scale-[0.96] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center justify-center gap-3">
                    <i data-lucide="rocket" class="w-5 h-5"></i> 启动空间作业
                </button>
            </div>
        </div>

        <!-- 3D 拣货实景层 (移除了鼠标滚轮拦截，把缩放权还给 3D OrbitControls) -->
        <div id="view-3d-picking" class="absolute inset-0 z-20 hidden">
            <!-- Background Wall -->
            <div id="layer1-bg-wall" class="absolute inset-0 z-10 pointer-events-none">
                <div id="cabinet-wall-container">
                    <div id="cabinet-view" class="swipe-container">
                        <div id="swipe-layer-current" class="swipe-slide"></div>
                        <div id="swipe-layer-next" class="swipe-slide hidden"></div>
                    </div>
                </div>
            </div>

            <!-- 3D Hologram -->
            <div id="layer2-3d-hologram" class="absolute inset-0 z-30 pointer-events-none flex items-center justify-center overflow-hidden dynamic-ui">
                <!-- 将交互热区限制在模型周围 -->
                <div id="local-interaction-zone" class="absolute w-[80vw] max-w-[420px] h-[80vw] max-h-[420px] z-40 pointer-events-auto touch-none cursor-grab active:cursor-grabbing rounded-full"></div>
                <div id="part-3d-viewer" class="w-full h-full pointer-events-none"></div>
            </div>

            <div class="absolute inset-0 z-50 pointer-events-none">
                <div id="model-loader-ui" class="absolute inset-0 flex flex-col items-center justify-center hidden pointer-events-none">
                    <div class="w-16 h-16 rounded-[1.5rem] bg-white/80 backdrop-blur-2xl shadow-[0_20px_40px_-10px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 flex items-center justify-center mb-4">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-slate-900"></i>
                    </div>
                </div>

                <div class="absolute right-6 bottom-10 sm:right-10 sm:bottom-1/4 flex flex-col items-center gap-5 sm:gap-6 pointer-events-auto">
                    <button onclick="adjustQuantity(1)" class="interactive-btn group relative flex items-center justify-center w-14 h-14 rounded-full bg-white/80 backdrop-blur-2xl shadow-[0_12px_30px_-5px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 text-slate-600 hover:text-brand-600 hover:-translate-y-1">
                        <i data-lucide="plus" class="w-5 h-5 transition-transform group-hover:scale-110"></i>
                    </button>
                    <button onclick="adjustQuantity(-1)" class="interactive-btn group relative flex items-center justify-center w-14 h-14 rounded-full bg-white/80 backdrop-blur-2xl shadow-[0_12px_30px_-5px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 text-slate-600 hover:text-brand-600 hover:-translate-y-1">
                        <i data-lucide="minus" class="w-5 h-5 transition-transform group-hover:scale-110"></i>
                    </button>
                    <button onclick="reportShortage()" class="interactive-btn group relative flex items-center justify-center w-14 h-14 rounded-full bg-white/80 backdrop-blur-2xl shadow-[0_12px_30px_-5px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 text-red-400 hover:text-red-500 hover:-translate-y-1 mt-2">
                        <i data-lucide="triangle-alert" class="w-5 h-5 transition-transform group-hover:scale-110"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 结果统计与导出弹层 (精致 Modal) -->
    <div id="job-log-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-md hidden opacity-0 transition-opacity duration-500 pointer-events-auto">
        <div class="bg-white/90 backdrop-blur-3xl w-[95%] sm:w-[92%] max-w-4xl max-h-[85vh] rounded-[2rem] sm:rounded-[2.5rem] shadow-[0_50px_100px_-20px_rgba(0,0,0,0.2),inset_0_1px_1px_rgba(255,255,255,1)] border border-white/60 flex flex-col overflow-hidden transform scale-95 transition-transform duration-700 ease-[cubic-bezier(0.16,1,0.3,1)]" id="job-log-modal">
            <div class="p-6 sm:p-8 border-b border-slate-200/50 flex justify-between items-center bg-white/50">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-[1.5rem] bg-gradient-to-br from-emerald-400 to-emerald-500 text-white flex items-center justify-center shadow-[inset_0_1px_1px_rgba(255,255,255,0.4),_0_12px_24px_-6px_rgba(16,185,129,0.4)]"><i data-lucide="check-check" class="w-6 h-6"></i></div>
                    <div>
                        <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tighter">作业已完成</h2>
                        <p id="log-summary-text" class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-1">--</p>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto no-scrollbar relative p-5 sm:p-8 bg-slate-50/50">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-white/80 backdrop-blur-xl z-10 shadow-sm rounded-xl overflow-hidden">
                        <tr>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-400 uppercase tracking-widest rounded-tl-xl rounded-bl-xl">颗粒资产名称</th>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-400 uppercase tracking-widest hidden sm:table-cell">物理位置</th>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">实际 / 目标</th>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center rounded-tr-xl rounded-br-xl">状态追踪</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
            
            <div class="p-5 sm:p-6 border-t border-slate-200/50 bg-white/50 flex flex-col sm:flex-row justify-end gap-4">
                <button onclick="exportLogToExcel()" class="h-12 w-full sm:w-auto px-6 rounded-[1.2rem] bg-white shadow-[0_4px_15px_-3px_rgba(0,0,0,0.05),inset_0_1px_1px_rgba(255,255,255,1)] border border-slate-200 text-slate-600 font-bold hover:text-brand-600 hover:-translate-y-0.5 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="download" class="w-4 h-4"></i> 导出日志
                </button>
                <button onclick="closeLogAndReset()" class="h-12 w-full sm:w-auto px-8 rounded-[1.2rem] bg-slate-900 text-white shadow-[0_10px_20px_-5px_rgba(0,0,0,0.2)] font-bold tracking-wide hover:-translate-y-0.5 active:scale-95 transition-all duration-300 text-sm flex justify-center items-center">
                    返回数字大厅
                </button>
            </div>
        </div>
    </div>

    <script>
        const showToast = (msg, isError = false) => {
            const t = document.createElement('div');
            t.className = `fixed top-12 left-1/2 -translate-x-1/2 px-6 py-4 rounded-full font-bold text-[13px] shadow-[0_20px_40px_rgba(0,0,0,0.1),inset_0_1px_1px_rgba(255,255,255,1)] z-[9999] transition-all duration-500 transform translate-y-[-30px] opacity-0 flex items-center gap-3 backdrop-blur-2xl ${isError ? 'bg-red-50/90 text-red-600 border border-red-200/50' : 'bg-white/90 text-slate-800 border border-white/60'}`;
            t.innerHTML = `${isError ? '<i data-lucide="triangle-alert" class="w-4 h-4"></i>' : '<i data-lucide="info" class="w-4 h-4 text-slate-500"></i>'} <span>${msg}</span>`;
            document.body.appendChild(t);
            lucide.createIcons();
            requestAnimationFrame(() => { t.classList.remove('translate-y-[-30px]', 'opacity-0'); t.classList.add('translate-y-0', 'opacity-100'); });
            setTimeout(() => {
                t.classList.remove('translate-y-0', 'opacity-100'); t.classList.add('translate-y-[-30px]', 'opacity-0');
                setTimeout(() => t.remove(), 500);
            }, 3000);
        };

        const state = { 
            pickingTasks: [], isGuiding: false, currentTaskIndex: -1, mainView: 'map', 
            jobStartTime: null, sidebarOpen: false, isAnimating: false, currentCabinetId: null
        };

        window.GlobalModelCache = {}; 
        window.GlobalModelIdCache = {}; 

        const TextCanvas = document.createElement('canvas'); 
        TextCanvas.width = 512; TextCanvas.height = 128; 
        const TextCtx = TextCanvas.getContext('2d');
        
        let SharedTextTexture, SharedTextMat, SharedPlaneGeo, SharedBoxGeo, SharedBoxMat;

        const initThreeGlobals = () => {
            if(SharedTextTexture) return;
            SharedTextTexture = new THREE.CanvasTexture(TextCanvas);
            SharedTextTexture.anisotropy = 4; SharedTextTexture.minFilter = THREE.LinearFilter;
            SharedTextMat = new THREE.MeshBasicMaterial({ map: SharedTextTexture, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide });
            SharedPlaneGeo = new THREE.PlaneGeometry(8, 2);
            SharedBoxGeo = new THREE.BoxGeometry(2, 1.2, 1);
            SharedBoxMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.1, roughness: 0.2 });
        };

        const updateVolumetricText = (text, isShortage) => {
            TextCtx.clearRect(0, 0, 512, 128);
            TextCtx.font = "900 60px 'Noto Sans SC', 'Inter', sans-serif"; 
            TextCtx.textAlign = 'center'; TextCtx.textBaseline = 'middle';
            TextCtx.lineWidth = 8; TextCtx.strokeStyle = '#ffffff'; 
            TextCtx.strokeText(text, 256, 64);
            const gradient = TextCtx.createLinearGradient(0, 20, 0, 108);
            if (isShortage) { gradient.addColorStop(0, '#f87171'); gradient.addColorStop(1, '#dc2626'); } 
            else { gradient.addColorStop(0, '#64748b'); gradient.addColorStop(1, '#334155'); }
            TextCtx.fillStyle = gradient; TextCtx.fillText(text, 256, 64);
            if(SharedTextTexture) SharedTextTexture.needsUpdate = true;
        };

        const formatCabinetId = (id) => id.replace('S-', '小柜').replace('L-', '大柜');

        const generateCabinets = () => {
            const cabinets = [];
            const createCab = (id, numId, type, x, y) => ({ id, displayId: (type === 'large' ? '大柜' : '小柜') + numId, type, x, y, rows: type === 'large' ? 10 : 15, cols: type === 'large' ? 3 : 5 });
            const rightS = [
                { id: 20, y: 1 }, { id: 19, y: 2 }, { id: 18, y: 4 }, { id: 17, y: 5 }, { id: 16, y: 6 }, { id: 15, y: 7 },
                { id: 14, y: 9 }, { id: 13, y: 10 }, { id: 12, y: 11 }, { id: 11, y: 12 }, { id: 10, y: 14 }, { id: 9, y: 15 }, 
                { id: 8, y: 16 }, { id: 7, y: 17 }, { id: 6, y: 19 }, { id: 5, y: 20 }, { id: 4, y: 21 }, { id: 3, y: 22 },
                { id: 2, y: 27 }, { id: 1, y: 28 }
            ];
            rightS.forEach(c => cabinets.push(createCab(`S-${c.id}`, `${c.id}`, 'small', 4, c.y)));
            for (let i = 1; i <= 10; i++) cabinets.push(createCab(`L-${i}`, `${i}`, 'large', 0, 11 - i));
            cabinets.push(createCab('S-21', '21', 'small', 0, 14));
            cabinets.push(createCab('S-22', '22', 'small', 0, 19));
            cabinets.push(createCab('S-23', '23', 'small', 0, 20));
            cabinets.push(createCab('S-24', '24', 'small', 0, 25));
            cabinets.push(createCab('S-25', '25', 'small', 0, 26));
            return cabinets;
        };

        const CABINETS = generateCabinets();
        const ENTRANCE = { x: 2, y: 30 }; 

        const handleExcelUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (typeof XLSX === 'undefined') { showToast("解析引擎仍在加载中，请稍候再试", true); return; }

            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                let sheetName = "拾件器";
                if (!workbook.Sheets[sheetName]) sheetName = workbook.SheetNames[0];
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});

                let newTasks = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    const qty = parseInt(row[1]) || 1; const partName = row[2] || "未知物件";
                    const smallLoc = row[3]; const largeLoc = row[5];
                    let locStr = ""; let isLarge = false;

                    if (smallLoc && String(smallLoc).trim() !== "") { locStr = String(smallLoc).trim(); } 
                    else if (largeLoc && String(largeLoc).trim() !== "") { locStr = String(largeLoc).trim(); isLarge = true; } 
                    else continue;

                    const match = locStr.match(/^(\d+)[柜-]?(\d+)-(\d+)$/);
                    if (match) {
                        const cabId = `${isLarge ? "L" : "S"}-${match[1]}`;
                        const cab = CABINETS.find(c => c.id === cabId);
                        if (cab) {
                            newTasks.push({ id: Math.random().toString(36).substr(2), cabinetId: cabId, displayCab: cab.displayId, quantity: qty, originalQuantity: qty, row: parseInt(match[2]), col: parseInt(match[3]), partName: partName, isShortage: false });
                        }
                    }
                }

                if (newTasks.length > 0) {
                    state.pickingTasks = newTasks;
                    document.getElementById('empty-state-overlay').classList.add('hidden');
                    
                    const startOverlay = document.getElementById('start-job-overlay');
                    startOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        document.getElementById('preload-panel').classList.remove('translate-y-4', 'opacity-0');
                    }, 50);

                    updateUI('up');
                    document.getElementById('preload-status-text').innerText = `0 / ${[...new Set(newTasks.map(t => t.partName))].length}`;
                } else showToast("未在文件中找到有效的位置数据，请检查格式！", true);
                document.getElementById('excel-upload').value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        const startPreload = async () => {
            const btn = document.getElementById('btn-preload');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 模型数据建立中...`;
            btn.classList.replace('hover:-translate-y-0.5', 'opacity-80');
            lucide.createIcons();

            const uniqueParts = [...new Set(state.pickingTasks.map(t => t.partName))];
            const total = uniqueParts.length;
            let loaded = 0;
            
            await batchFetchCloudModelIds(uniqueParts);

            for (const partName of uniqueParts) {
                if (!window.GlobalModelCache[partName]) {
                    const uuid = await fetchCloudModelId(partName);
                    if (uuid) {
                        const CDN = 'https://a.unity.cn/client_api/v1/buckets/181aa46a-4b2b-41d9-9765-38454415dee3/content/简模/';
                        let raw = null;
                        try { raw = await loadModelAsset(`${CDN}${uuid}.obj`, 'obj'); } 
                        catch(e1) { try { raw = await loadModelAsset(`${CDN}${uuid}.fbx`, 'fbx'); } catch(e2) {} }
                        
                        if (raw) window.GlobalModelCache[partName] = processRawModel(raw, partName);
                    }
                }
                loaded++;
                document.getElementById('preload-progress-bar').style.width = `${(loaded / total) * 100}%`;
                document.getElementById('preload-status-text').innerText = `${loaded} / ${total}`;
            }

            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> 资产加载就绪`;
            btn.classList.replace('bg-indigo-50', 'bg-emerald-50');
            btn.classList.replace('text-brand-600', 'text-emerald-600');
            btn.classList.replace('border-indigo-100', 'border-emerald-100');
            lucide.createIcons();
            
            showToast("所有模型已预先缓存，作业过程将获得极致顺滑体验！");
        };

        const batchFetchCloudModelIds = async (partNames) => {
            if (!partNames || partNames.length === 0) return;
            const API_ENDPOINT = 'https://stateless.unity.cn/release/2e87e2f7-8488-4b42-9a17-a4dce04e1ec3/CloudPath';
            for (let i = 0; i < partNames.length; i += 200) {
                const chunk = partNames.slice(i, i + 200);
                const query = `SELECT 颗粒名称, UUID FROM IT_GBase WHERE 颗粒名称 IN (${chunk.map(()=>'?').join(',')})`;
                try {
                    const res = await fetch(API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'dbOperation', query: query, queryParams: chunk }) });
                    const data = await res.json();
                    (data.data || data.result || []).forEach(record => { if (record['颗粒名称'] && record['UUID']) window.GlobalModelIdCache[record['颗粒名称']] = record['UUID']; });
                } catch (e) { console.error("API Error:", e); }
            }
        };

        const fetchCloudModelId = async (partName) => {
            if (!window.GlobalModelIdCache[partName]) await batchFetchCloudModelIds([partName]);
            return window.GlobalModelIdCache[partName] || null;
        };

        const loadModelAsset = (url, type) => new Promise((resolve, reject) => new (type === 'obj' ? THREE.OBJLoader : THREE.FBXLoader)().load(url, resolve, undefined, reject));

        // 核心修复 ①：放大基础基准比例，动态靶向曲线更加舒展
        const processRawModel = (rawModel, partName) => {
            const baseColors = [0x6366f1, 0x10b981, 0xf43f5e, 0xf59e0b, 0x8b5cf6, 0x0ea5e9];
            let hash = 0; for (let j = 0; j < partName.length; j++) hash = partName.charCodeAt(j) + ((hash << 5) - hash);
            const customMat = new THREE.MeshStandardMaterial({ color: baseColors[Math.abs(hash) % baseColors.length], metalness: 0.2, roughness: 0.1, clearcoat: 0.8 });
            rawModel.traverse(child => { if (child.isMesh) child.material = customMat; });
            const box = new THREE.Box3().setFromObject(rawModel);
            
            if (box.isEmpty()) return new THREE.Group();

            const center = box.getCenter(new THREE.Vector3());
            rawModel.position.sub(center);

            const wrapper = new THREE.Group(); 
            wrapper.add(rawModel);
            
            const size = box.getSize(new THREE.Vector3()); 
            const maxDim = Math.max(size.x, size.y, size.z);
            
            // 比例全面放大调优，保证小模型不再迷你，大模型依然受限
            if (maxDim > 0 && isFinite(maxDim)) {
                let targetSize;
                if (maxDim > 10.0) {
                    targetSize = 4.0; // 提升了大模型的阈值（原为2.5）
                } else if (maxDim < 0.2) {
                    targetSize = 1.2; // 提升了微小模型的阈值（原为0.8）
                } else {
                    targetSize = Math.sqrt(maxDim) * 1.8; // 中等件曲线放大了 50%
                }
                wrapper.scale.setScalar(targetSize / maxDim);
            }
            return wrapper;
        };

        // ================= 3D Engine =================
        const viewer3D = { scene: null, camera: null, renderer: null, controls: null, activeWrapper: null, labelGroup: null, currentSession: 0, currentPart: null };
        
        let targetWallRotX = 8, targetWallRotY = -18, targetWallOffsetY = 0; 
        let currentWallRotX = 8, currentWallRotY = -18, currentWallOffsetY = 0;
        let wallContainerEl = null;

        function init3DPartViewer() {
            const container = document.getElementById('part-3d-viewer');
            wallContainerEl = document.getElementById('cabinet-wall-container');
            if (!container) return;
            viewer3D.scene = new THREE.Scene();
            viewer3D.camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 100);
            viewer3D.camera.position.set(0, 3.5, 20); 
            viewer3D.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            viewer3D.renderer.setSize(container.clientWidth, container.clientHeight);
            viewer3D.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            container.appendChild(viewer3D.renderer.domElement);
            
            // 将手势事件绑定层限制为局部的 3D 模型区域
            const interactZone = document.getElementById('local-interaction-zone');
            viewer3D.controls = new THREE.OrbitControls(viewer3D.camera, interactZone);
            viewer3D.controls.enableDamping = true; viewer3D.controls.dampingFactor = 0.05;
            
            viewer3D.controls.minDistance = 8; // 放宽最小放大距离
            viewer3D.controls.maxDistance = 50; // 放宽最大缩小距离
            
            viewer3D.controls.enablePan = false; 
            viewer3D.controls.enableZoom = true;
            viewer3D.controls.enableRotate = true;
            viewer3D.controls.autoRotate = true;
            viewer3D.controls.autoRotateSpeed = 1.0;

            viewer3D.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dir = new THREE.DirectionalLight(0xffffff, 0.6); dir.position.set(5, 10, 7); viewer3D.scene.add(dir); 
            const dir2 = new THREE.DirectionalLight(0xffffff, 0.4); dir2.position.set(-5, 5, -7); viewer3D.scene.add(dir2);

            const animate = () => {
                requestAnimationFrame(animate); 
                
                if (state.mainView === 'cabinet') {
                    // 核心修复 ②：降速使得过渡更为顺滑（从 0.08 降为 0.05）
                    currentWallRotX += (targetWallRotX - currentWallRotX) * 0.05;
                    currentWallRotY += (targetWallRotY - currentWallRotY) * 0.05;
                    currentWallOffsetY += (targetWallOffsetY - currentWallOffsetY) * 0.05;
                    
                    if (wallContainerEl && (Math.abs(targetWallRotX - currentWallRotX) > 0.01 || Math.abs(targetWallRotY - currentWallRotY) > 0.01 || Math.abs(targetWallOffsetY - currentWallOffsetY) > 0.01)) {
                        wallContainerEl.style.transform = `rotateX(${currentWallRotX.toFixed(2)}deg) rotateY(${currentWallRotY.toFixed(2)}deg) translateZ(-50px) translateY(${currentWallOffsetY.toFixed(2)}vh)`;
                    }

                    if (viewer3D.controls && viewer3D.controls.enabled) viewer3D.controls.update();
                    viewer3D.renderer.render(viewer3D.scene, viewer3D.camera);
                }
            };
            animate();

            new ResizeObserver(() => {
                if (container.clientWidth > 0 && container.clientHeight > 0 && viewer3D.camera) {
                    viewer3D.camera.aspect = container.clientWidth / container.clientHeight;
                    viewer3D.camera.updateProjectionMatrix(); viewer3D.renderer.setSize(container.clientWidth, container.clientHeight);
                }
            }).observe(container);
        }

        const render3DPreviewAsync = async (partName, initialQty, isShortage, direction = 'up') => {
            if (!partName) return;
            if (!viewer3D.scene) init3DPartViewer();
            if (!viewer3D.scene) return;

            const session = ++viewer3D.currentSession;
            const loaderUi = document.getElementById('model-loader-ui');

            if (viewer3D.activeWrapper) {
                const oldWrapper = viewer3D.activeWrapper;
                viewer3D.activeWrapper = null; 
                if (viewer3D.controls) viewer3D.controls.enabled = false;
                
                const flyDist = 25;
                const targetY = direction === 'up' ? flyDist : -flyDist;
                new TWEEN.Tween(oldWrapper.position).to({ y: targetY }, 250).easing(TWEEN.Easing.Cubic.In).start();
                new TWEEN.Tween(oldWrapper.scale).to({ x: 0.1, y: 0.1, z: 0.1 }, 250).easing(TWEEN.Easing.Cubic.In).onComplete(() => {
                    viewer3D.scene.remove(oldWrapper); 
                }).start();
            }

            await new Promise(resolve => setTimeout(resolve, 250));
            if (session !== viewer3D.currentSession) return;

            loaderUi.classList.remove('hidden');

            updateVolumetricText(`${partName}  x  ${initialQty}`, isShortage);

            const newWrapper = new THREE.Group(); 
            newWrapper.isTaskWrapper = true; 
            
            let physicalModel = new THREE.Group();
            // 核心修复 ①：额外加持，让经过靶向曲线优化的模型整体再放大 40% 的视野占比
            physicalModel.scale.setScalar(1.4); 
            newWrapper.add(physicalModel);

            const label3D = new THREE.Group();
            label3D.add(new THREE.Mesh(SharedPlaneGeo, SharedTextMat));
            label3D.position.y = 1.5; 
            newWrapper.add(label3D); 
            viewer3D.labelGroup = label3D;
            
            viewer3D.activeWrapper = newWrapper;

            jumpHologramPosition();
            
            const flyDist = 25;
            viewer3D.scene.add(newWrapper);
            newWrapper.position.y = direction === 'up' ? -flyDist : flyDist; 
            newWrapper.scale.set(0.1, 0.1, 0.1);
            new TWEEN.Tween(newWrapper.position).to({ y: 0 }, 400).easing(TWEEN.Easing.Back.Out).start();
            new TWEEN.Tween(newWrapper.scale).to({ x: 1, y: 1, z: 1 }, 400).easing(TWEEN.Easing.Back.Out).onComplete(() => {
                if (viewer3D.controls) viewer3D.controls.enabled = true;
            }).start();

            if (!window.GlobalModelCache[partName]) {
                const uuid = await fetchCloudModelId(partName);
                if (session !== viewer3D.currentSession) return;
                if (uuid) {
                    const CDN = 'https://a.unity.cn/client_api/v1/buckets/181aa46a-4b2b-41d9-9765-38454415dee3/content/简模/';
                    let raw = null;
                    try { 
                        await new Promise(resolve => setTimeout(resolve, 50)); 
                        raw = await loadModelAsset(`${CDN}${uuid}.obj`, 'obj'); 
                    } catch(e1) { 
                        try { 
                            await new Promise(resolve => setTimeout(resolve, 50)); 
                            raw = await loadModelAsset(`${CDN}${uuid}.fbx`, 'fbx'); 
                        } catch(e2) {} 
                    }
                    if (session !== viewer3D.currentSession) return;
                    if (raw) window.GlobalModelCache[partName] = processRawModel(raw, partName);
                }
            }

            if (session !== viewer3D.currentSession) return;

            let loadedMesh = null;
            if (window.GlobalModelCache[partName]) {
                loadedMesh = window.GlobalModelCache[partName].clone();
            } else { 
                loadedMesh = new THREE.Mesh(SharedBoxGeo, SharedBoxMat); 
            }
            
            physicalModel.add(loadedMesh);
            const box = new THREE.Box3().setFromObject(loadedMesh); 
            let maxY = 1.0; 
            if (isFinite(box.max.y) && !isNaN(box.max.y)) maxY = box.max.y;

            new TWEEN.Tween(label3D.position).to({ y: maxY + 1.2 }, 400).easing(TWEEN.Easing.Cubic.Out).start();

            const targetScale = loadedMesh.scale.clone(); 
            
            loadedMesh.scale.setScalar(0.001);
            new TWEEN.Tween(loadedMesh.scale)
                .to({ x: targetScale.x, y: targetScale.y, z: targetScale.z }, 600)
                .easing(TWEEN.Easing.Elastic.Out)
                .start();

            if (session === viewer3D.currentSession) {
                loaderUi.classList.add('hidden');
            }
        };

        const update3DQuantity = (qty, isShortage) => {
            if (viewer3D.activeWrapper && viewer3D.labelGroup) {
                updateVolumetricText(`${viewer3D.currentPart}  x  ${qty}`, isShortage);
                viewer3D.labelGroup.scale.setScalar(0.6); 
                new TWEEN.Tween(viewer3D.labelGroup.scale).to({ x: 1, y: 1, z: 1 }, 600).easing(TWEEN.Easing.Elastic.Out).start();
            }
        };

        // ================= 2D Map Control =================
        const mapState = { viewBox: { x: -40, y: -50, w: 340, h: 1080 }, isDragging: false, lastX: 0, lastY: 0, startX: 0, startY: 0, needsFocus: true, clickTarget: null };

        window.mapZoom = (dir) => {
            const zoom = dir > 0 ? 0.75 : 1.33; const cx = mapState.viewBox.x + mapState.viewBox.w / 2; const cy = mapState.viewBox.y + mapState.viewBox.h / 2;
            mapState.viewBox.w *= zoom; mapState.viewBox.h *= zoom; mapState.viewBox.x = cx - mapState.viewBox.w / 2; mapState.viewBox.y = cy - mapState.viewBox.h / 2;

            state.pickingTasks.forEach(t => {
                const isS = t.quantity < t.originalQuantity; if(isS) totShort++; totItems++;
                html += `<tr class="hover:bg-slate-100/50 transition-colors group"><td class="py-4 px-5 text-[13px] font-bold text-slate-800 max-w-[120px] sm:max-w-[200px] truncate">${t.partName}</td><td class="py-4 px-5 text-xs font-mono font-bold text-slate-500 hidden sm:table-cell">${t.displayCab} / ${t.row}-${t.col}</td><td class="py-4 px-5 text-center"><span class="text-sm font-black ${isS?'text-red-500':'text-slate-900'}">${t.quantity}</span> <span class="text-[10px] text-slate-400">/</span> <span class="text-xs font-bold text-slate-400">${t.originalQuantity}</span></td><td class="py-4 px-5 text-center">${isS?'<div class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-50 border border-red-100 text-red-600 rounded-lg text-[10px] font-black uppercase tracking-widest"><i data-lucide="alert-circle" class="w-3 h-3"></i> 缺件</div>':'<div class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 border border-emerald-100 text-emerald-600 rounded-lg text-[10px] font-black uppercase tracking-widest"><i data-lucide="check" class="w-3 h-3"></i> 正常</div>'}</td></tr>`;
            });
            document.getElementById('log-table-body').innerHTML = html; document.getElementById('log-summary-text').innerText = `已处理 ${totItems} 项颗粒资产 · 发现 ${totShort} 项缺件异常`;
            document.getElementById('view-3d-picking').classList.add('hidden');
            const pipeline = document.getElementById('cabinet-pipeline'); if (pipeline) pipeline.classList.add('hidden');
            switchMainView('map'); document.getElementById('map-container').classList.add('blur-lg');
            
            const overlay = document.getElementById('job-log-overlay'), modal = document.getElementById('job-log-modal');
            overlay.classList.remove('hidden'); setTimeout(() => { overlay.classList.remove('opacity-0'); modal.classList.remove('scale-95'); lucide.createIcons(); }, 50);
        };

        const exportLogToExcel = () => {
            if (typeof XLSX === 'undefined') { showToast("导出引擎未就绪", true); return; }
            const wsData = [["颗粒名称", "柜组", "网格", "目标量", "实际取出", "状态"]];
            state.pickingTasks.forEach(t => wsData.push([t.partName, t.displayCab, `'${t.row}-${t.col}`, t.originalQuantity, t.quantity, t.quantity < t.originalQuantity ? '⚠️ 缺件' : '✅ 正常']));
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsData), "日志");
            XLSX.writeFile(wb, `作业日志_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.xlsx`);
        };

        const closeLogAndReset = () => {
            const o = document.getElementById('job-log-overlay'), m = document.getElementById('job-log-modal');
            o.classList.add('opacity-0'); m.classList.add('scale-95');
            setTimeout(() => {
                o.classList.add('hidden'); document.getElementById('map-container').classList.remove('blur-lg');
                state.pickingTasks = []; state.currentTaskIndex = -1; state.isGuiding = false; viewer3D.currentPart = null;
                document.getElementById('start-job-overlay').classList.add('hidden'); 
                document.getElementById('preload-panel').classList.add('translate-y-4', 'opacity-0');
                
                const btn = document.getElementById('btn-preload');
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'bg-emerald-50', 'text-emerald-600', 'border-emerald-100');
                btn.classList.add('bg-indigo-50', 'text-brand-600', 'border-indigo-100', 'hover:-translate-y-0.5');
                btn.innerHTML = `<i data-lucide="cloud-download" class="w-4 h-4"></i> 开始预加载所有模型，拒绝卡顿`;
                
                document.getElementById('preload-progress-bar').style.width = '0%';
                
                document.getElementById('empty-state-overlay').classList.remove('hidden');
                switchMainView('map'); updateUI('none');
            }, 500);
        };

        const startGuidance = () => { 
            if(state.pickingTasks.length){ 
                state.pickingTasks.sort((a,b)=>{const [tA,nA]=a.cabinetId.split('-'),[tB,nB]=b.cabinetId.split('-'); if(tA!==tB)return tA==='S'?-1:1; return parseInt(nA)-parseInt(nB);});
                state.isGuiding = true; state.jobStartTime = new Date(); 
                
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(permissionState => {
                        if (permissionState === 'granted') window.addEventListener('deviceorientation', handleDeviceOrientation);
                    }).catch(console.error);
                } else {
                    window.addEventListener('deviceorientation', handleDeviceOrientation);
                }

                switchMainView('cabinet'); goToTask(0);
                setTimeout(()=>document.getElementById('task-list-container').scrollTo({top:0,behavior:'smooth'}), 100); 
            } 
        };

        const goToTask = (targetIndex) => {
            if (state.isAnimating || targetIndex === state.currentTaskIndex || targetIndex < 0) return;
            if (targetIndex >= state.pickingTasks.length) { showJobLog(); return; }

            const nextT = state.pickingTasks[targetIndex]; if (!nextT) return;
            const isSameCab = state.currentCabinetId === nextT.cabinetId, dir = targetIndex > state.currentTaskIndex ? 'up' : 'down';
            state.isAnimating = true; state.currentTaskIndex = targetIndex; state.currentCabinetId = nextT.cabinetId; 
            
            updateUI(dir);

            if (isSameCab) {
                const cabEl = document.getElementById('swipe-layer-current')?.querySelector('.cabinet-grid');
                if(cabEl) { cabEl.innerHTML = generateGridHTML(CABINETS.find(c=>c.id===nextT.cabinetId), targetIndex); renderNavPath('current', targetIndex); lucide.createIcons(); }
                setTimeout(()=>document.getElementById('task-list-container').querySelector('#active-task-item')?.scrollIntoView({behavior:'smooth',block:'center'}), 100);
                state.isAnimating = false;
            } else {
                const curL = document.getElementById('swipe-layer-current'), nexL = document.getElementById('swipe-layer-next');
                renderCabinetGridFull('next', targetIndex); nexL.classList.remove('hidden');
                
                curL.style.transition = 'transform 0.5s cubic-bezier(0.55, 0.085, 0.68, 0.53), opacity 0.5s ease-in';
                curL.style.transform = dir === 'up' ? 'translateY(-60%)' : 'translateY(60%)'; curL.style.opacity = '0';
                nexL.style.transition = 'none'; nexL.style.transform = dir === 'up' ? 'translateY(60%)' : 'translateY(-60%)'; nexL.style.opacity = '0';
                
                setTimeout(() => {
                    nexL.style.transition = 'transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease-out';
                    nexL.style.transform = 'translateY(0)'; nexL.style.opacity = '1';
                    
                    setTimeout(() => {
                        curL.style.transition = 'none'; curL.innerHTML = nexL.innerHTML; curL.style.transform = 'translateY(0)'; curL.style.opacity = '1';
                        nexL.classList.add('hidden');
                        document.getElementById('task-list-container').querySelector('#active-task-item')?.scrollIntoView({behavior:'smooth',block:'center'});
                        state.isAnimating = false; renderNavPath('current', state.currentTaskIndex);
                    }, 700); 
                }, 450); 
            }
        };

        const nextGuidanceStep = () => goToTask(state.currentTaskIndex + 1);
        const prevGuidanceStep = () => goToTask(state.currentTaskIndex - 1);

        let initialBeta = null; 

        // 核心修复 ②：对陀螺仪信号加上安全的角度钳位(Clamp)，并强化顺滑度
        const handleDeviceOrientation = (e) => {
            if (state.mainView !== 'cabinet' || !e.gamma || !e.beta) return;
            
            let gamma = e.gamma; 
            let beta = e.beta;   
            
            if (initialBeta === null) initialBeta = beta;
            
            gamma = Math.max(-60, Math.min(60, gamma));
            let betaDiff = beta - initialBeta;
            if (betaDiff > 180) betaDiff -= 360; else if (betaDiff < -180) betaDiff += 360;
            betaDiff = Math.max(-60, Math.min(60, betaDiff));
            
            const rx = gamma / 25;
            const ry = betaDiff / 25;
            
            const rawY = -18 + rx * 45; 
            const rawX = 8 - ry * 35; 
            
            // 加入安全极限阈值锁定，绝不翻出界
            targetWallRotY = Math.max(-40, Math.min(4, rawY)); 
            targetWallRotX = Math.max(-10, Math.min(26, rawX)); 
        };

        const adjustCabinetWallPosition = () => {
            const nextLayer = document.getElementById('swipe-layer-next');
            const activeCell = (nextLayer && !nextLayer.classList.contains('hidden')) ? nextLayer.querySelector('.grid-cell.active') : document.querySelector('#swipe-layer-current .grid-cell.active');
            if (!activeCell) return;
            const cabGrid = activeCell.closest('.cabinet-grid'); if(!cabGrid) return;

            const relativeY = (activeCell.offsetTop + activeCell.offsetHeight / 2) / cabGrid.offsetHeight;
            const panRange = window.innerWidth < 768 ? 130 : 60; 
            const baseOffset = window.innerWidth < 768 ? -18 : 0; 
            
            targetWallOffsetY = (0.5 - relativeY) * panRange + baseOffset; 
        };

        const jumpHologramPosition = () => {
            const nextLayer = document.getElementById('swipe-layer-next');
            const activeCell = (nextLayer && !nextLayer.classList.contains('hidden')) ? nextLayer.querySelector('.grid-cell.active') : document.querySelector('#swipe-layer-current .grid-cell.active');
            if (!activeCell) return;
            const cabGrid = activeCell.closest('.cabinet-grid'); if(!cabGrid) return;

            const relativeX = (activeCell.offsetLeft + activeCell.offsetWidth / 2) / cabGrid.offsetWidth;
            const relativeY = (activeCell.offsetTop + activeCell.offsetHeight / 2) / cabGrid.offsetHeight;
            const holoEl = document.getElementById('layer2-3d-hologram');
            if (!holoEl) return;
            
            const viewW = window.innerWidth;
            const isMobile = viewW < 768;
            
            let targetX = 0;
            let targetY = 0;
            
            if (isMobile) {
                targetX = relativeX < 0.5 ? (viewW * 0.15) : (-viewW * 0.15);
                targetY = relativeY < 0.5 ? (window.innerHeight * 0.28) : (-window.innerHeight * 0.28);
                holoEl.style.setProperty('--anim-scale', '0.55');
            } else {
                targetX = relativeX < 0.5 ? (viewW * 0.22) : (-viewW * 0.22);
                targetY = 0;
                holoEl.style.setProperty('--anim-scale', '1');
            }
            
            holoEl.style.transition = 'none';
            holoEl.style.setProperty('--ui-x', `${targetX}px`);
            holoEl.style.setProperty('--ui-y', `${targetY}px`);
            
            void holoEl.offsetWidth; 
            
            holoEl.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out';
        };

        const setupInteractions = () => {
            const view3D = document.getElementById('view-3d-picking');
            
            window.addEventListener('mousemove', e => {
                if (state.mainView !== 'cabinet') return;
                const rx = (e.clientX / window.innerWidth - 0.5) * 2; 
                const ry = (e.clientY / window.innerHeight - 0.5) * 2;
                
                // 桌面端的极限角度限制
                targetWallRotY = Math.max(-35, Math.min(0, -18 + rx * 25));
                targetWallRotX = Math.max(-5, Math.min(25, 8 - ry * 20)); 
            });

            const preventCheck = (e) => e.target.closest('button') || e.target.closest('#main-sidebar') || e.target.closest('#cabinet-pipeline');

            let touchStartY = 0, touchStartX = 0, touchStartTime = 0;
            
            view3D.addEventListener('touchstart', e => { 
                touchStartY = e.touches[0].clientY; 
                touchStartX = e.touches[0].clientX; 
                touchStartTime = Date.now();
            }, {passive: true});
            
            view3D.addEventListener('touchend', e => {
                if(state.mainView !== 'cabinet' || preventCheck(e)) return; 
                const dy = touchStartY - e.changedTouches[0].clientY; 
                const dx = Math.abs(touchStartX - e.changedTouches[0].clientX);
                const dt = Date.now() - touchStartTime;

                const isLocalZone = e.target.closest('#local-interaction-zone');

                if (isLocalZone) {
                    // 在模型区域内，严格切分“手指拖拽旋转”和“快速滑动翻页”
                    if (dt < 400 && Math.abs(dy) > 60 && Math.abs(dy) > dx * 1.5) { 
                        if(dy > 0) prevGuidanceStep(); 
                        else nextGuidanceStep(); 
                    }
                } else {
                    // 在模型外部的空白区，只需普通的滑动即可翻页
                    if (Math.abs(dy) > 40 && Math.abs(dy) > dx) { 
                        if(dy > 0) prevGuidanceStep(); 
                        else nextGuidanceStep(); 
                    }
                }
            }, {passive: true});
        };

        const initApp = () => {
            if (viewer3D.scene) return; 
            initThreeGlobals(); 
            init3DPartViewer(); 
            setupInteractions(); 
            renderMap(); 
            if (window.lucide) lucide.createIcons();
            const tweenUpdate = (time) => { requestAnimationFrame(tweenUpdate); if (typeof TWEEN !== 'undefined') TWEEN.update(time); };
            tweenUpdate();
        };

        window.addEventListener('WMSDepsLoaded', () => {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }
        });
    </script>
</body>
</html>
