<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WMS Pro - 极致玻璃拟态版</title>
    
    <!-- 顶级无衬线排版字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: { 
                        brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <!-- 顺序依赖加载器 -->
    <script>
        (function() {
            const scripts = [
                "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js",
                "https://unpkg.com/fflate@0.8.2/umd/index.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js",
                "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"
            ];
            
            let i = 0;
            function loadNext() {
                if (i >= scripts.length) {
                    window.dispatchEvent(new Event('WMSDepsLoaded'));
                    return;
                }
                const s = document.createElement('script');
                s.src = scripts[i];
                s.onload = () => { i++; loadNext(); };
                s.onerror = () => { console.warn('Failed to load external dependency:', s.src); i++; loadNext(); };
                document.head.appendChild(s);
            }
            loadNext();
        })();
    </script>

    <style>
        /* 极致的基础设定与滚动控制 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #fafafa; 
            overflow: hidden; 
            overscroll-behavior-y: none; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        @supports (height: 100dvh) {
            body { height: 100dvh; }
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .swipe-container { position: absolute; inset: 0; overflow: hidden; perspective: 2000px; transform-style: preserve-3d; }
        .swipe-slide { position: absolute; inset: 0; transform-style: preserve-3d; }

        /* 3D 柜体容器 */
        #cabinet-wall-container {
            width: 120vw; height: 120vh;
            position: absolute; left: -10vw; top: -10vh; 
            transform-style: preserve-3d;
            transform: rotateX(8deg) rotateY(-18deg) translateZ(-50px) translateY(0vh);
            will-change: transform; 
        }

        .cabinet-grid { 
            display: grid; 
            gap: clamp(8px, 2.5vw, 18px); 
            width: 100%; height: 100%; 
            padding: 12vh 6vw 15vh; 
            transform-style: preserve-3d; position: relative;
            align-content: center;
        }
        @media (min-width: 640px) {
            .cabinet-grid { padding: 15vh 12vw 15vh; }
        }
        
        /* 玻璃拟态格子 */
        .grid-cell {
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: clamp(8px, 2vw, 16px); 
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace; 
            font-size: clamp(12px, 3.5vw, 15px); 
            font-weight: 700; color: #94a3b8;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; z-index: 2; 
            transform: translateZ(0); 
        }
        
        .grid-cell.picked {
            background: rgba(255, 255, 255, 0.15); color: transparent;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            border: 1px dashed rgba(148, 163, 184, 0.3); opacity: 0.6; z-index: 1;
        }
        
        .grid-cell.picked > div.absolute {
            transform: translateZ(1px);
        }

        .drawer-box {
            position: absolute; inset: -1px; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0); pointer-events: none; opacity: 0;
            will-change: transform;
        }
        
        .grid-cell.active { background: transparent; box-shadow: none; border-color: transparent; z-index: 50; }
        .grid-cell.active .drawer-box { transform: translateZ(clamp(60px, 15vw, 100px)); opacity: 1; }
        
        /* Stripe 质感渐变与阴影 */
        .drawer-front {
            position: absolute; inset: 0; 
            background: linear-gradient(135deg, #6366f1, #4f46e5); color: white;
            border-radius: clamp(8px, 2vw, 16px); 
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(18px, 6vw, 28px); font-weight: 900; 
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 20px 40px -10px rgba(99,102,241,0.6);
            transform: translateZ(2px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .drawer-top, .drawer-bottom, .drawer-left, .drawer-right { position: absolute; background: #4338ca; }
        
        .drawer-top { top: 0; left: 8px; right: 8px; height: clamp(60px, 15vw, 100px); transform-origin: top; transform: rotateX(-90deg); background: linear-gradient(to bottom, #4f46e5, #4338ca); border-radius: 8px 8px 0 0;}
        .drawer-bottom { bottom: 0; left: 8px; right: 8px; height: clamp(60px, 15vw, 100px); transform-origin: bottom; transform: rotateX(90deg); background: #312e81; box-shadow: 0 40px 60px -10px rgba(0,0,0,0.5); }
        .drawer-left { top: 8px; bottom: 8px; left: 0; width: clamp(60px, 15vw, 100px); transform-origin: left; transform: rotateY(90deg); }
        .drawer-right { top: 8px; bottom: 8px; right: 0; width: clamp(60px, 15vw, 100px); transform-origin: right; transform: rotateY(-90deg); }

        .path-svg { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; transform: translateZ(-2px); }
        @keyframes flowGlow { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
        .flowing-path { animation: flowGlow 1.2s linear infinite; }

        /* 模型交互区 */
        #part-3d-viewer canvas { 
            filter: drop-shadow(0 40px 40px rgba(0,0,0,0.15)); 
            transform-origin: center bottom;
            outline: none;
        }

        .sidebar-collapse { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        svg text { user-select: none; }

        .dynamic-ui {
            --ui-x: 0px;
            --ui-y: 0px;
            --anim-y: 0px;
            --anim-scale: 1;
            transform: translate(var(--ui-x), calc(var(--ui-y) + var(--anim-y))) scale(var(--anim-scale));
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out;
        }
        
        .interactive-btn {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .interactive-btn:active {
            transform: scale(0.92) translateY(2px);
        }

        /* 背景弥散光晕动画 */
        @keyframes orb-float-1 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5%, 10%) scale(1.1); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes orb-float-2 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-5%, -5%) scale(1.05); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes orb-float-3 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(10%, -10%) scale(1.15); } 100% { transform: translate(0, 0) scale(1); } }
    </style>
</head>
<body class="w-screen h-[100dvh] flex relative select-none">

    <!-- 背景弥散光晕 (Mesh Gradient) 为玻璃拟态提供折射源 -->
    <div class="fixed inset-0 z-[1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[60vw] h-[60vw] max-w-[600px] max-h-[600px] rounded-full bg-brand-400/20 blur-[100px] mix-blend-multiply" style="animation: orb-float-1 12s ease-in-out infinite;"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[70vw] h-[70vw] max-w-[700px] max-h-[700px] rounded-full bg-blue-400/20 blur-[120px] mix-blend-multiply" style="animation: orb-float-2 15s ease-in-out infinite alternate;"></div>
        <div class="absolute top-[20%] right-[10%] w-[50vw] h-[50vw] max-w-[400px] max-h-[400px] rounded-full bg-emerald-300/15 blur-[90px] mix-blend-multiply" style="animation: orb-float-3 10s ease-in-out infinite alternate;"></div>
    </div>

    <!-- 侧边栏边缘手势捕获区 & 小滑块 (移动端专属) -->
    <div id="sidebar-edge-zone" class="fixed left-0 top-0 bottom-0 w-6 z-[85] sm:hidden touch-none"></div>
    <div id="sidebar-edge-handle" onclick="toggleSidebar(true)" class="fixed left-0 top-1/2 -translate-y-1/2 w-3 h-20 bg-white/60 backdrop-blur-3xl shadow-[2px_0_10px_rgba(31,38,135,0.15)] rounded-r-[12px] z-[86] sm:hidden transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center justify-center cursor-pointer border border-l-0 border-white/80">
        <div class="w-[3px] h-8 bg-white/90 rounded-full shadow-sm"></div>
    </div>

    <div class="fixed bottom-28 sm:bottom-4 right-4 z-[9999] text-[10px] font-mono text-slate-400/60 pointer-events-none select-none tracking-wider transition-all duration-300">
        Build: 2021-03-28 14:50 CST
    </div>

    <!-- 隐藏的文件上传域 -->
    <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">

    <!-- 移动端侧边栏遮罩 -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-[85] hidden opacity-0 transition-opacity duration-500 lg:hidden"></div>

    <!-- 侧边栏 Toggle 按钮 (极致玻璃拟态) -->
    <button id="main-sidebar-toggle-btn" onclick="toggleSidebar()" class="fixed top-5 left-4 sm:top-6 sm:left-6 z-[100] w-12 h-12 rounded-[1.2rem] bg-white/40 backdrop-blur-3xl shadow-[0_12px_40px_-8px_rgba(31,38,135,0.1),inset_0_1px_1px_rgba(255,255,255,0.8)] border border-white/50 flex items-center justify-center text-slate-700 hover:shadow-[0_16px_50px_-10px_rgba(31,38,135,0.15)] hover:bg-white/50 hover:-translate-y-1 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] pointer-events-auto group interactive-btn">
        <i data-lucide="menu" id="sidebar-icon" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
    </button>

    <!-- 视图切换按钮 (极致玻璃拟态) -->
    <button id="toggle-map-btn" onclick="toggleMainView()" class="fixed top-5 right-4 sm:top-6 sm:right-6 z-[100] w-12 h-12 rounded-[1.2rem] bg-white/40 backdrop-blur-3xl border border-white/50 shadow-[0_12px_40px_-8px_rgba(31,38,135,0.1),inset_0_1px_1px_rgba(255,255,255,0.8)] flex items-center justify-center text-slate-700 hover:shadow-[0_16px_50px_-10px_rgba(31,38,135,0.15)] hover:bg-white/50 hover:-translate-y-1 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] pointer-events-auto group interactive-btn">
        <i data-lucide="map" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
    </button>

    <!-- 空间导航路径指示器 -->
    <div id="cabinet-pipeline" class="fixed top-[4.5rem] sm:top-6 left-1/2 transform -translate-x-1/2 z-[80] flex items-center gap-1 sm:gap-2 max-w-[96vw] sm:max-w-[65vw] overflow-x-auto no-scrollbar py-2 px-1 sm:px-2 opacity-0 pointer-events-none transition-all duration-500"></div>

    <!-- 侧边栏列表 (极致玻璃拟态) -->
    <aside id="main-sidebar" class="fixed left-0 top-0 bottom-0 w-full sm:w-[340px] p-5 sm:p-7 pt-24 sm:pt-28 z-[90] bg-white/80 sm:bg-white/30 backdrop-blur-[40px] sm:backdrop-blur-3xl border-r border-white/40 shadow-[20px_0_60px_-20px_rgba(31,38,135,0.08)] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] sidebar-collapse flex flex-col">
        <div class="px-2 pb-6 flex items-center gap-4 shrink-0">
            <div class="w-12 h-12 rounded-[1.2rem] bg-gradient-to-br from-slate-800 to-black shadow-[0_12px_24px_-6px_rgba(0,0,0,0.4),inset_0_1px_1px_rgba(255,255,255,0.2)] flex items-center justify-center text-white">
                <i data-lucide="layers" class="w-6 h-6"></i>
            </div>
            <h1 class="font-black text-2xl text-slate-900 tracking-tighter">WMS Pro</h1>
        </div>
        
        <div class="px-2 py-4 mb-4 shrink-0">
            <div class="flex justify-between items-end mb-3 text-[10px] font-black text-slate-500 uppercase tracking-widest">
                <span>总作业进度</span><span class="text-brand-600 font-mono text-xs" id="sidebar-progress-text">0 / 0</span>
            </div>
            <div class="w-full bg-slate-200/40 backdrop-blur-md shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] h-2.5 rounded-full overflow-hidden p-[2px] border border-white/40">
                <div id="sidebar-progress-bar" class="bg-gradient-to-r from-brand-400 to-brand-600 h-full rounded-full transition-all duration-500 ease-out shadow-[0_0_12px_rgba(99,102,241,0.6)]" style="width: 0%"></div>
            </div>
        </div>

        <div id="task-list-container" class="flex-1 overflow-y-auto no-scrollbar space-y-3 px-1 pb-10"></div>
    </aside>

    <main class="flex-1 h-full relative z-[5] flex flex-col overflow-hidden">
        <!-- 2D 鸟瞰地图层 -->
        <div id="view-2d-map" class="absolute inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-500">
            <!-- 缩放与聚焦浮层控件 (极致玻璃拟态) -->
            <div class="absolute bottom-28 sm:bottom-20 right-6 sm:right-12 z-50 flex flex-col gap-4 mb-[env(safe-area-inset-bottom)] transition-all duration-300">
                <button onclick="mapFocusCurrent()" class="w-12 h-12 sm:w-14 sm:h-14 bg-white/40 backdrop-blur-3xl text-slate-700 rounded-full shadow-[0_12px_40px_-8px_rgba(31,38,135,0.1),inset_0_1px_1px_rgba(255,255,255,0.8)] border border-white/50 flex items-center justify-center hover:text-brand-600 hover:bg-white/50 hover:-translate-y-1 transition-all duration-500 ease-out pointer-events-auto interactive-btn group" title="重新聚焦"><i data-lucide="crosshair" class="w-5 h-5 group-active:scale-90"></i></button>
                <div class="flex flex-col bg-white/40 backdrop-blur-3xl rounded-[1.2rem] sm:rounded-[1.5rem] shadow-[0_12px_40px_-8px_rgba(31,38,135,0.1),inset_0_1px_1px_rgba(255,255,255,0.8)] border border-white/50 overflow-hidden pointer-events-auto">
                    <button onclick="mapZoom(1)" class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center text-slate-700 hover:text-brand-600 hover:bg-white/50 transition-all duration-300 group interactive-btn"><i data-lucide="plus" class="w-5 h-5 group-active:scale-90"></i></button>
                    <div class="w-full h-[1px] bg-slate-200/50"></div>
                    <button onclick="mapZoom(-1)" class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center text-slate-700 hover:text-brand-600 hover:bg-white/50 transition-all duration-300 group interactive-btn"><i data-lucide="minus" class="w-5 h-5 group-active:scale-90"></i></button>
                </div>
            </div>
            
            <div id="map-container" class="w-full h-full relative z-10 flex items-center justify-center"></div>

            <!-- 空状态浮层 (极致玻璃拟态) -->
            <div id="empty-state-overlay" class="absolute inset-0 flex items-center justify-center z-20 backdrop-blur-xl bg-[#fafafa]/20 transition-all duration-500 pointer-events-auto px-4">
                <div class="bg-white/40 backdrop-blur-3xl shadow-[0_40px_100px_-20px_rgba(31,38,135,0.15),inset_0_1px_1px_rgba(255,255,255,0.8)] border border-white/50 rounded-[2rem] sm:rounded-[2.5rem] p-8 sm:p-12 flex flex-col items-center max-w-[90%] sm:max-w-md w-full hover:-translate-y-2 transition-transform duration-700 ease-[cubic-bezier(0.16,1,0.3,1)]">
                    <div class="w-20 h-20 rounded-[1.5rem] bg-gradient-to-b from-indigo-50/80 to-indigo-100/50 shadow-[inset_0_2px_4px_rgba(255,255,255,0.8),_0_10px_20px_-5px_rgba(99,102,241,0.2)] border border-white flex items-center justify-center text-brand-500 mb-8 backdrop-blur-md">
                        <i data-lucide="file-spreadsheet" class="w-10 h-10"></i>
                    </div>
                    <h2 class="text-2xl font-black text-slate-900 mb-3 tracking-tighter text-center">导入拣货清单</h2>
                    <p class="text-[11px] text-slate-500 font-bold mb-10 uppercase tracking-widest text-center">请上传带有位置信息的 Excel 文件</p>
                    <button onclick="document.getElementById('excel-upload').click()" class="w-full bg-slate-900/90 backdrop-blur-md text-white py-5 sm:py-6 rounded-[1.5rem] font-black text-base sm:text-lg tracking-wide shadow-[0_15px_30px_-10px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.2)] hover:shadow-[0_20px_40px_-12px_rgba(0,0,0,0.4)] hover:-translate-y-1 active:scale-[0.98] transition-all duration-500 flex justify-center items-center gap-3 border border-slate-700">
                        <i data-lucide="upload" class="w-5 h-5"></i> 选择并解析文件
                    </button>
                </div>
            </div>

            <!-- 开始作业按钮浮层 (极致玻璃拟态) -->
            <div id="start-job-overlay" class="absolute inset-x-0 bottom-28 sm:bottom-20 mb-[env(safe-area-inset-bottom)] z-50 hidden pointer-events-auto flex flex-col items-center justify-end gap-4 px-4 transition-all duration-300">
                
                <!-- 预加载面板 -->
                <div id="preload-panel" class="w-full max-w-[90%] sm:max-w-md bg-white/40 backdrop-blur-3xl shadow-[0_30px_60px_-15px_rgba(31,38,135,0.15),inset_0_1px_1px_rgba(255,255,255,0.8)] border border-white/50 rounded-[1.5rem] p-5 flex flex-col gap-4 transform translate-y-4 opacity-0 transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] delay-100">
                    <div class="flex justify-between items-center px-1">
                        <span class="text-[11px] font-bold text-slate-600 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="box" class="w-3.5 h-3.5"></i> 空间资产缓存</span>
                        <span id="preload-status-text" class="text-xs font-mono font-black text-brand-600">0 / 0</span>
                    </div>
                    <div class="w-full bg-slate-200/50 rounded-full h-2.5 overflow-hidden border border-white/40 shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)]">
                        <div id="preload-progress-bar" class="bg-gradient-to-r from-brand-400 to-brand-600 h-full w-0 transition-all duration-300 ease-out shadow-[0_0_10px_rgba(99,102,241,0.5)]"></div>
                    </div>
                    <button id="btn-preload" onclick="startPreload()" class="w-full bg-white/50 backdrop-blur text-brand-600 py-3.5 rounded-[1rem] font-bold text-sm hover:bg-white/80 hover:-translate-y-0.5 active:scale-[0.98] transition-all flex items-center justify-center gap-2 border border-white shadow-sm">
                        <i data-lucide="cloud-download" class="w-4 h-4"></i> 开始预加载所有模型，拒绝卡顿
                    </button>
                </div>

                <button onclick="startGuidance()" class="w-full max-w-[90%] sm:max-w-md bg-slate-900/90 backdrop-blur-md text-white py-4.5 sm:py-5 rounded-[2rem] text-base sm:text-lg font-black tracking-tight shadow-[0_20px_40px_-10px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.2)] hover:shadow-[0_30px_60px_-15px_rgba(0,0,0,0.4)] hover:-translate-y-1.5 active:scale-[0.96] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center justify-center gap-3 border border-slate-700">
                    <i data-lucide="rocket" class="w-5 h-5"></i> 启动空间作业
                </button>
            </div>
        </div>

        <!-- 3D 拣货实景层 -->
        <div id="view-3d-picking" class="absolute inset-0 z-20 hidden pointer-events-auto touch-none">
            <div id="layer1-bg-wall" class="absolute inset-0 z-10 pointer-events-none">
                <div id="cabinet-wall-container">
                    <div id="cabinet-view" class="swipe-container">
                        <div id="swipe-layer-current" class="swipe-slide"></div>
                        <div id="swipe-layer-next" class="swipe-slide hidden"></div>
                    </div>
                </div>
            </div>

            <!-- 3D Hologram 视图 -->
            <div id="layer2-3d-hologram" class="absolute inset-0 z-30 flex items-center justify-center overflow-hidden dynamic-ui pointer-events-none touch-none">

    <!-- 结果统计与导出弹层 (极致玻璃拟态) -->
    <div id="job-log-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-md hidden opacity-0 transition-opacity duration-500 pointer-events-auto">

            <div class="p-6 sm:p-8 border-b border-white/40 flex justify-between items-center bg-white/20">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-[1.5rem] bg-gradient-to-br from-emerald-400 to-emerald-500 text-white flex items-center justify-center shadow-[inset_0_1px_1px_rgba(255,255,255,0.4),_0_12px_24px_-6px_rgba(16,185,129,0.4)]"><i data-lucide="check-check" class="w-6 h-6"></i></div>
                    <div>
                        <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tighter">作业已完成</h2>
                        <p id="log-summary-text" class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mt-1">--</p>

            <div class="flex-1 overflow-y-auto no-scrollbar relative p-5 sm:p-8 bg-slate-50/10">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-white/40 backdrop-blur-xl z-10 shadow-sm rounded-xl overflow-hidden border border-white/30">
                        <tr>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-600 uppercase tracking-widest rounded-tl-xl rounded-bl-xl">颗粒资产名称</th>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-600 uppercase tracking-widest hidden sm:table-cell">物理位置</th>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-600 uppercase tracking-widest text-center">实际 / 目标</th>
                            <th class="py-4 px-4 sm:px-6 text-[10px] font-black text-slate-600 uppercase tracking-widest text-center rounded-tr-xl rounded-br-xl">状态追踪</th>

            <div class="p-5 sm:p-6 border-t border-white/40 bg-white/20 flex justify-center">
                <button id="btn-archive" onclick="archiveJob()" class="h-14 w-full sm:w-80 rounded-[1.5rem] bg-slate-900/90 backdrop-blur-md text-white shadow-[0_10px_30px_-5px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.2)] border border-slate-700 font-black tracking-wide hover:-translate-y-1 active:scale-95 transition-all duration-300 text-base flex justify-center items-center gap-3">
                    <i data-lucide="archive" class="w-5 h-5"></i> 完成归档
                </button>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg, isError = false) {
            const t = document.createElement('div');
            t.className = `fixed top-12 left-1/2 -translate-x-1/2 px-6 py-4 rounded-[1.5rem] font-bold text-[13px] shadow-[0_20px_40px_rgba(31,38,135,0.15),inset_0_1px_1px_rgba(255,255,255,0.8)] z-[9999] transition-all duration-500 transform translate-y-[-30px] opacity-0 flex items-center gap-3 backdrop-blur-3xl ${isError ? 'bg-red-50/70 text-red-600 border border-red-200/50' : 'bg-white/60 text-slate-800 border border-white'}`;
            t.innerHTML = `${isError ? '<i data-lucide="triangle-alert" class="w-4 h-4"></i>' : '<i data-lucide="info" class="w-4 h-4 text-slate-500"></i>'} <span>${msg}</span>`;
            document.body.appendChild(t);
            if (window.lucide) lucide.createIcons();
            requestAnimationFrame(() => { t.classList.remove('translate-y-[-30px]', 'opacity-0'); t.classList.add('translate-y-0', 'opacity-100'); });
            setTimeout(() => {
                t.classList.remove('translate-y-0', 'opacity-100'); t.classList.add('translate-y-[-30px]', 'opacity-0');
                setTimeout(() => t.remove(), 500);
            }, 3000);
        }

       const state = { 
            pickingTasks: [], isGuiding: false, currentTaskIndex: -1, mainView: 'map', 
            jobStartTime: null, sidebarOpen: false, isAnimating: false, currentCabinetId: null,
            queryID: null, drawingName: '未知图纸', modelsPreloaded: false
        };

        // 全局缓存字典
        window.GlobalModelCache = {};     // 缓存已解析的 3D 模型对象 (Three.js Object3D)
        window.GlobalModelIdCache = {};   // 缓存 颗粒名称 -> 模型 UUID
        window.GlobalLocationCache = {};  // 缓存 颗粒名称 -> { loc: 位置字符串, type: 柜体类型 }

        const TextCanvas = document.createElement('canvas'); 
        TextCanvas.width = 512; TextCanvas.height = 128; 
        const TextCtx = TextCanvas.getContext('2d');
        
        let SharedTextTexture, SharedTextMat, SharedPlaneGeo, SharedBoxGeo, SharedBoxMat;

        function initThreeGlobals() {
            if(SharedTextTexture || typeof THREE === 'undefined') return;
            SharedTextTexture = new THREE.CanvasTexture(TextCanvas);
            SharedTextTexture.anisotropy = 4; SharedTextTexture.minFilter = THREE.LinearFilter;
            SharedTextMat = new THREE.MeshBasicMaterial({ map: SharedTextTexture, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide });
            SharedPlaneGeo = new THREE.PlaneGeometry(8, 2);
            SharedBoxGeo = new THREE.BoxGeometry(2, 1.2, 1);
            SharedBoxMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.1, roughness: 0.2 });
        }

        function updateVolumetricText(text, isShortage) {
            TextCtx.clearRect(0, 0, 512, 128);
            TextCtx.font = "900 60px 'Noto Sans SC', 'Inter', sans-serif"; 
            TextCtx.textAlign = 'center'; TextCtx.textBaseline = 'middle';
            TextCtx.lineWidth = 8; TextCtx.strokeStyle = '#ffffff'; 
            TextCtx.strokeText(text, 256, 64);
            const gradient = TextCtx.createLinearGradient(0, 20, 0, 108);
            if (isShortage) { gradient.addColorStop(0, '#f87171'); gradient.addColorStop(1, '#dc2626'); } 
            else { gradient.addColorStop(0, '#64748b'); gradient.addColorStop(1, '#334155'); }
            TextCtx.fillStyle = gradient; TextCtx.fillText(text, 256, 64);
            if(SharedTextTexture) SharedTextTexture.needsUpdate = true;
        }

        function generateCabinets() {
            const cabinets = [];
            const createCab = (id, numId, type, x, y) => ({ id, displayId: (type === 'large' ? '大柜' : '小柜') + numId, type, x, y, rows: type === 'large' ? 10 : 15, cols: type === 'large' ? 3 : 5 });
            const rightS = [
                { id: 20, y: 1 }, { id: 19, y: 2 }, { id: 18, y: 4 }, { id: 17, y: 5 }, { id: 16, y: 6 }, { id: 15, y: 7 },
                { id: 14, y: 9 }, { id: 13, y: 10 }, { id: 12, y: 11 }, { id: 11, y: 12 }, { id: 10, y: 14 }, { id: 9, y: 15 }, 
                { id: 8, y: 16 }, { id: 7, y: 17 }, { id: 6, y: 19 }, { id: 5, y: 20 }, { id: 4, y: 21 }, { id: 3, y: 22 },
                { id: 2, y: 27 }, { id: 1, y: 28 }
            ];
            rightS.forEach(c => cabinets.push(createCab(`S-${c.id}`, `${c.id}`, 'small', 4, c.y)));
            for (let i = 1; i <= 10; i++) cabinets.push(createCab(`L-${i}`, `${i}`, 'large', 0, 11 - i));
            cabinets.push(createCab('S-21', '21', 'small', 0, 14));
            cabinets.push(createCab('S-22', '22', 'small', 0, 19));
            cabinets.push(createCab('S-23', '23', 'small', 0, 20));
            cabinets.push(createCab('S-24', '24', 'small', 0, 25));
            cabinets.push(createCab('S-25', '25', 'small', 0, 26));
            return cabinets;
        }

        const CABINETS = generateCabinets();
        const ENTRANCE = { x: 2, y: 30 }; 

        /**
         * 批量查询云端颗粒的模型 UUID 和库位信息，并写入全局缓存
         * @param {Array<string>} partNames - 需要查询的颗粒名称数组
         */
        async function batchFetchCloudModelIds(partNames) {
            if (!partNames || partNames.length === 0) return;
            
            const API_ENDPOINT = 'https://stateless.unity.cn/release/2e87e2f7-8488-4b42-9a17-a4dce04e1ec3/CloudPath';
            const chunkSize = 200; 
            
            for (let i = 0; i < partNames.length; i += chunkSize) {
                const chunk = partNames.slice(i, i + chunkSize);
                const placeholders = chunk.map(() => '?').join(',');
                
                // 一次性查出：UUID + 物理库位 + 柜体类型
                const query = `SELECT 颗粒名称, UUID, 位置, 柜体 FROM Design_Itempicker WHERE 颗粒名称 IN (${placeholders})`;
                
                try {
                    const res = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'dbOperation',
                            query: query,
                            queryParams: chunk
                        })
                    });
                    const data = await res.json();
                    const records = data.data || data.result || [];
                    
                    records.forEach(record => {
                        const partName = record['颗粒名称'];
                        if (!partName) return;

                        // 1. 处理模型 UUID 缓存
                        let uuidVal = record['UUID'];
                        // 容错处理复杂格式，同时防范单引号 JSON 报错
                        if (typeof uuidVal === 'string' && uuidVal.startsWith('[')) {
                            try {
                                const parsed = JSON.parse(uuidVal.replace(/'/g, '"'));
                                if (Array.isArray(parsed) && parsed.length > 0) uuidVal = parsed[0];
                            } catch(e) {
                                console.warn(`解析 UUID 格式失败: ${partName}`, e);
                            }
                        } else if (Array.isArray(uuidVal) && uuidVal.length > 0) {
                            uuidVal = uuidVal[0];
                        }
                        
                        if (uuidVal) {
                            window.GlobalModelIdCache[partName] = String(uuidVal);
                        }

                        // 2. 处理物理库位缓存
                        if (record['位置'] || record['柜体']) {
                            window.GlobalLocationCache[partName] = {
                                loc: record['位置'] || '',
                                type: record['柜体'] || ''
                            };
                        }
                    });
                } catch (e) {
                    console.error(`批量拉取云端模型数据失败 (Chunk ${i}):`, e);
                }
            }
        }

        /**
         * 获取单个颗粒的 UUID（带自动缓存回退）
         */
        async function fetchCloudModelId(partName) {
            if (window.GlobalModelIdCache[partName]) {
                return window.GlobalModelIdCache[partName];
            }
            await batchFetchCloudModelIds([partName]);
            return window.GlobalModelIdCache[partName] || null;
        }

        /**
         * 将云端的文本库位信息解析为结构化的排布数据
         */
        function parseDbLocation(cacheData) {
            if (!cacheData || (!cacheData.loc && !cacheData.type)) {
                return { cabId: '未分配', row: 0, col: 0, rawStr: '暂无库位信息' };
            }
            
            const locStr = String(cacheData.loc).trim();
            const typeStr = String(cacheData.type).trim();
            
            const isLarge = typeStr === '大' || locStr.includes('大') || locStr.toUpperCase().startsWith('L');
            
            const nums = locStr.match(/\d+/g);
            if (nums && nums.length >= 3) {
                return {
                    cabId: `${isLarge ? 'L' : 'S'}-${nums[0]}`,
                    row: parseInt(nums[1], 10),
                    col: parseInt(nums[2], 10),
                    rawStr: `${isLarge ? '大柜' : '小柜'} ${locStr}`
                };
            }
            
            return { cabId: '未分配', row: 0, col: 0, rawStr: `位置异常: ${typeStr} ${locStr}` };
        }

    const parseRecordData = async (record) => {
            const extractFieldText = (fieldData) => {
                if (!fieldData) return '';
                if (typeof fieldData === 'string') return fieldData;
                if (Array.isArray(fieldData)) {
                    return fieldData.map(item => typeof item === 'object' ? (item.text || '') : String(item)).join('');
                }
                if (typeof fieldData === 'object') return fieldData.text || '';
                return String(fieldData);
            };

            const drawingName = extractFieldText(record.fields['图纸名称']) || '未知图纸';
            state.drawingName = drawingName; 
            
            const listData = record.fields['颗粒列表'] || record.fields['拾件列表'];
            const listStr = extractFieldText(listData) || '[]';
            
            let rawList = [];
            try {
                const cleanStr = listStr.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
                rawList = JSON.parse(cleanStr);
            } catch (err) {
                console.error('颗粒列表格式解析失败:', err);
                showToast("云端清单数据格式异常，无法解析", true);
                return;
            }

            const partNames = rawList.map(part => part['启蒙件名称'] || part['颗粒名称'] || part['零件名称'] || part['name'] || '未知颗粒');
            await batchFetchCloudModelIds(partNames);

            let newTasks = [];
            rawList.forEach(part => {
                const partName = part['启蒙件名称'] || part['颗粒名称'] || part['零件名称'] || part['name'] || '未知颗粒';
                const qty = part['用量'] || part['数量'] || part['qty'] || 1;
                
                let dbLocData = window.GlobalLocationCache[partName];
                if (!dbLocData) {
                    dbLocData = {
                        loc: part['位置'] || part['库位'] || part['location'] || '',
                        type: part['柜体'] || part['type'] || ''
                    };
                }
                
                const loc = parseDbLocation(dbLocData);
                
                // 核心修复：放宽限制，允许没有库位映射的颗粒进入队列（标记为未分配）
                let finalCabId = '未分配';
                let displayCab = '未分配';
                
                if (loc.cabId && loc.cabId !== '未分配') {
                    const cab = CABINETS.find(c => c.id === loc.cabId);
                    if (cab) {
                        finalCabId = cab.id;
                        displayCab = cab.displayId;
                    }
                }

                newTasks.push({
                    id: Math.random().toString(36).substr(2),
                    cabinetId: finalCabId,
                    displayCab: displayCab,
                    rawInput: loc.rawStr, 
                    quantity: parseInt(qty) || 1,
                    originalQuantity: parseInt(qty) || 1,
                    row: loc.row || 1,
                    col: loc.col || 1,
                    partName: partName,
                    isShortage: false,
                    rawPartObj: part 
                });
            });

            if (newTasks.length > 0) {
                state.pickingTasks = newTasks;
                document.getElementById('empty-state-overlay').classList.add('hidden');
                
                const startOverlay = document.getElementById('start-job-overlay');
                startOverlay.classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('preload-panel').classList.remove('translate-y-4', 'opacity-0');
                }, 50);

                updateUI('up');
                document.getElementById('preload-status-text').innerText = `0 / ${[...new Set(newTasks.map(t => t.partName))].length}`;
                showToast(`成功解析图纸数据: ${drawingName}`);
            } else {
                showToast("未在云端列表中找到有效颗粒数据", true);
            }
        };

     // ================= URL 触发器 =================
        const fetchRecordFromURL = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawID = urlParams.get('ID');
            if (!rawID) return;

            // 极限参数清洗：剔除所有空白与零宽字符
            const queryID = rawID.replace(/[\u200B-\u200D\uFEFF\s]/g, '').trim();
            state.queryID = queryID; 

            try {
                showToast("检测到作业ID，正在拉取云端清单...");
                const API_ENDPOINT = 'https://stateless.unity.cn/release/2e87e2f7-8488-4b42-9a17-a4dce04e1ec3/CloudPath';
                
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'getRecords',
                        BitableUUID: 'BitableUUID084', 
                        filter: {
                            conjunction: "and",
                            conditions: [
                                { field_name: "ID", operator: "is", value: [queryID] }
                            ]
                        }
                    })
                });

                const data = await response.json();
                
                // 严谨校验：确保 code 为 0 且数据层级完整
                if (data.code === 0 && data.data && data.data.items && data.data.items.length > 0) {
                    const record = data.data.items[0];
                    await parseRecordData(record); 
                } else {
                    console.error(`未找到对应的 Record 数据，查询ID: [${queryID}]`, data);
                    showToast('云端拉取异常：未找到对应的作业 ID', true);
                }
            } catch (e) {
                console.error('云端获取数据失败:', e);
                showToast('网络请求失败，请检查网络后刷新重试', true);
            }
        };

        function handleExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (typeof XLSX === 'undefined') { showToast("解析引擎仍在加载中，请稍候再试", true); return; }

            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                let sheetName = "拾件器";
                if (!workbook.Sheets[sheetName]) sheetName = workbook.SheetNames[0];
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});

                let newTasks = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    const qty = parseInt(row[1]) || 1; const partName = row[2] || "未知物件";
                    const smallLoc = row[3]; const largeLoc = row[5];
                    let locStr = ""; let isLarge = false;

                    if (smallLoc && String(smallLoc).trim() !== "") { locStr = String(smallLoc).trim(); } 
                    else if (largeLoc && String(largeLoc).trim() !== "") { locStr = String(largeLoc).trim(); isLarge = true; } 
                    else continue;

                    const match = locStr.match(/^(\d+)[柜-]?(\d+)-(\d+)$/);
                    if (match) {
                        const cabId = `${isLarge ? "L" : "S"}-${match[1]}`;
                        const cab = CABINETS.find(c => c.id === cabId);
                        if (cab) {
                            newTasks.push({ id: Math.random().toString(36).substr(2), cabinetId: cabId, displayCab: cab.displayId, quantity: qty, originalQuantity: qty, row: parseInt(match[2]), col: parseInt(match[3]), partName: partName, isShortage: false });
                        }
                    }
                }

                if (newTasks.length > 0) {
                    state.pickingTasks = newTasks;
                    document.getElementById('empty-state-overlay').classList.add('hidden');
                    
                    const startOverlay = document.getElementById('start-job-overlay');
                    startOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        document.getElementById('preload-panel').classList.remove('translate-y-4', 'opacity-0');
                    }, 50);

                    updateUI('up');
                    document.getElementById('preload-status-text').innerText = `0 / ${[...new Set(newTasks.map(t => t.partName))].length}`;
                } else showToast("未在文件中找到有效的位置数据，请检查格式！", true);
                document.getElementById('excel-upload').value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        async function startPreload() {
            const btn = document.getElementById('btn-preload');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 模型数据建立中...`;
            btn.classList.replace('hover:-translate-y-0.5', 'opacity-80');
            if (window.lucide) lucide.createIcons();

            const uniqueParts = [...new Set(state.pickingTasks.map(t => t.partName))];
            const total = uniqueParts.length;
            let loaded = 0;
            
            await batchFetchCloudModelIds(uniqueParts);

            for (const partName of uniqueParts) {
                if (!window.GlobalModelCache[partName]) {
                    const uuid = await fetchCloudModelId(partName);
                    if (uuid) {
                        const CDN = 'https://a.unity.cn/client_api/v1/buckets/181aa46a-4b2b-41d9-9765-38454415dee3/content/简模/';
                        let raw = null;
                        try { raw = await loadModelAsset(`${CDN}${uuid}.obj`, 'obj'); } 
                        catch(e1) { try { raw = await loadModelAsset(`${CDN}${uuid}.fbx`, 'fbx'); } catch(e2) {} }
                        
                        if (raw) window.GlobalModelCache[partName] = processRawModel(raw, partName);
                    }
                }
                loaded++;
                document.getElementById('preload-progress-bar').style.width = `${(loaded / total) * 100}%`;
                document.getElementById('preload-status-text').innerText = `${loaded} / ${total}`;
            }

            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> 资产加载就绪`;
            btn.classList.replace('text-brand-600', 'text-emerald-600');
            if (window.lucide) lucide.createIcons();
            
            showToast("所有模型已预先缓存，作业过程将获得极致顺滑体验！");
        }

        async function batchFetchCloudModelIds(partNames) {
            if (!partNames || partNames.length === 0) return;
            const API_ENDPOINT = 'https://stateless.unity.cn/release/2e87e2f7-8488-4b42-9a17-a4dce04e1ec3/CloudPath';
            for (let i = 0; i < partNames.length; i += 200) {
                const chunk = partNames.slice(i, i + 200);
                const query = `SELECT 颗粒名称, UUID FROM IT_GBase WHERE 颗粒名称 IN (${chunk.map(()=>'?').join(',')})`;
                try {
                    const res = await fetch(API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'dbOperation', query: query, queryParams: chunk }) });
                    const data = await res.json();
                    (data.data || data.result || []).forEach(record => { if (record['颗粒名称'] && record['UUID']) window.GlobalModelIdCache[record['颗粒名称']] = record['UUID']; });
                } catch (e) { console.error("API Error:", e); }
            }
        }

        async function fetchCloudModelId(partName) {
            if (!window.GlobalModelIdCache[partName]) await batchFetchCloudModelIds([partName]);
            return window.GlobalModelIdCache[partName] || null;
        }

        function loadModelAsset(url, type) {
            return new Promise((resolve, reject) => {
                if(typeof THREE === 'undefined') { reject("Three.js not loaded"); return; }
                new (type === 'obj' ? THREE.OBJLoader : THREE.FBXLoader)().load(url, resolve, undefined, reject);
            });
        }

        function processRawModel(rawModel, partName) {
            if(typeof THREE === 'undefined') return new THREE.Group();
            const baseColors = [0x6366f1, 0x10b981, 0xf43f5e, 0xf59e0b, 0x8b5cf6, 0x0ea5e9];
            let hash = 0; for (let j = 0; j < partName.length; j++) hash = partName.charCodeAt(j) + ((hash << 5) - hash);
            const customMat = new THREE.MeshStandardMaterial({ color: baseColors[Math.abs(hash) % baseColors.length], metalness: 0.2, roughness: 0.1, clearcoat: 0.8 });
            rawModel.traverse(child => { if (child.isMesh) child.material = customMat; });
            const box = new THREE.Box3().setFromObject(rawModel);
            
            if (box.isEmpty()) return new THREE.Group();

            const center = box.getCenter(new THREE.Vector3());
            rawModel.position.sub(center);

            const wrapper = new THREE.Group(); 
            wrapper.add(rawModel);
            
            const size = box.getSize(new THREE.Vector3()); 
            const maxDim = Math.max(size.x, size.y, size.z);
            
            if (maxDim > 0 && isFinite(maxDim)) {
                let targetSize;
                if (maxDim > 10.0) { targetSize = 4.0; } else if (maxDim < 0.2) { targetSize = 1.2; } else { targetSize = Math.sqrt(maxDim) * 1.8; }
                wrapper.scale.setScalar(targetSize / maxDim);
            }
            return wrapper;
        }

        // ================= 3D Engine =================
        const viewer3D = { scene: null, camera: null, renderer: null, controls: null, activeWrapper: null, labelGroup: null, currentSession: 0, currentPart: null };
        
        let targetWallRotX = 8, targetWallRotY = -18, targetWallOffsetY = 0, targetWallOffsetX = 0; 
        let currentWallRotX = 8, currentWallRotY = -18, currentWallOffsetY = 0, currentWallOffsetX = 0;
        let wallContainerEl = null;

        function init3DPartViewer() {
            if (typeof THREE === 'undefined') return;
            const container = document.getElementById('part-3d-viewer');
            wallContainerEl = document.getElementById('cabinet-wall-container');
            if (!container) return;
            
            const cWidth = container.clientWidth || window.innerWidth;
            const cHeight = container.clientHeight || window.innerHeight;

            viewer3D.scene = new THREE.Scene();
            viewer3D.camera = new THREE.PerspectiveCamera(35, cWidth / cHeight, 0.1, 100);
            viewer3D.camera.position.set(0, 3.5, 20); 
            viewer3D.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            viewer3D.renderer.setSize(cWidth, cHeight);
            viewer3D.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            container.appendChild(viewer3D.renderer.domElement);
            
            if(THREE.OrbitControls) {
                viewer3D.controls = new THREE.OrbitControls(viewer3D.camera, viewer3D.renderer.domElement);
                viewer3D.controls.enableDamping = true; viewer3D.controls.dampingFactor = 0.05;
                viewer3D.controls.minDistance = 8; viewer3D.controls.maxDistance = 50; 
                viewer3D.controls.enablePan = false; viewer3D.controls.enableZoom = true;
                viewer3D.controls.enableRotate = true; viewer3D.controls.autoRotate = true;
                viewer3D.controls.autoRotateSpeed = 1.0;
            }

            viewer3D.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dir = new THREE.DirectionalLight(0xffffff, 0.6); dir.position.set(5, 10, 7); viewer3D.scene.add(dir); 
            const dir2 = new THREE.DirectionalLight(0xffffff, 0.4); dir2.position.set(-5, 5, -7); viewer3D.scene.add(dir2);

            const animate = () => {
                requestAnimationFrame(animate); 
                
                if (state.mainView === 'cabinet') {
                    currentWallRotX += (targetWallRotX - currentWallRotX) * 0.05;
                    currentWallRotY += (targetWallRotY - currentWallRotY) * 0.05;
                    currentWallOffsetY += (targetWallOffsetY - currentWallOffsetY) * 0.05;
                    currentWallOffsetX += (targetWallOffsetX - currentWallOffsetX) * 0.05;
                    
                    if (wallContainerEl && (Math.abs(targetWallRotX - currentWallRotX) > 0.01 || Math.abs(targetWallRotY - currentWallRotY) > 0.01 || Math.abs(targetWallOffsetY - currentWallOffsetY) > 0.01 || Math.abs(targetWallOffsetX - currentWallOffsetX) > 0.01)) {
                        wallContainerEl.style.transform = `rotateX(${currentWallRotX.toFixed(2)}deg) rotateY(${currentWallRotY.toFixed(2)}deg) translateZ(-50px) translateY(${currentWallOffsetY.toFixed(2)}vh) translateX(${currentWallOffsetX.toFixed(2)}vw)`;
                    }

                    if (viewer3D.controls && viewer3D.controls.enabled) viewer3D.controls.update();
                    viewer3D.renderer.render(viewer3D.scene, viewer3D.camera);
                }
            };
            animate();

            new ResizeObserver(() => {
                if (container.clientWidth > 0 && container.clientHeight > 0 && viewer3D.camera) {
                    viewer3D.camera.aspect = container.clientWidth / container.clientHeight;
                    viewer3D.camera.updateProjectionMatrix(); viewer3D.renderer.setSize(container.clientWidth, container.clientHeight);
                }
            }).observe(container);
        }

        async function render3DPreviewAsync(partName, initialQty, isShortage, direction = 'up') {
            if (!partName || typeof THREE === 'undefined') return;
            if (!viewer3D.scene) init3DPartViewer();
            if (!viewer3D.scene) return;

            const session = ++viewer3D.currentSession;
            const loaderUi = document.getElementById('model-loader-ui');

            if (viewer3D.activeWrapper) {
                const oldWrapper = viewer3D.activeWrapper;
                viewer3D.activeWrapper = null; 
                if (viewer3D.controls) viewer3D.controls.enabled = false;
                
                const flyDist = 25;
                const targetY = direction === 'up' ? flyDist : -flyDist;
                new TWEEN.Tween(oldWrapper.position).to({ y: targetY }, 250).easing(TWEEN.Easing.Cubic.In).start();
                new TWEEN.Tween(oldWrapper.scale).to({ x: 0.1, y: 0.1, z: 0.1 }, 250).easing(TWEEN.Easing.Cubic.In).onComplete(() => {
                    viewer3D.scene.remove(oldWrapper); 
                }).start();
            }

            if (viewer3D.camera && viewer3D.controls) {

                    .to({ x: 0, y: 3.5, z: 20 }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
                new TWEEN.Tween(viewer3D.controls.target)
                    .to({ x: 0, y: 0, z: 0 }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => viewer3D.controls.update())
                    .start();
            }

            await new Promise(resolve => setTimeout(resolve, 250));
            if (session !== viewer3D.currentSession) return;

            loaderUi.classList.remove('hidden');

            updateVolumetricText(`${partName}  x  ${initialQty}`, isShortage);

            const newWrapper = new THREE.Group(); 
            newWrapper.isTaskWrapper = true; 
            
            let physicalModel = new THREE.Group();
            physicalModel.scale.setScalar(1.4); 
            newWrapper.add(physicalModel);

            const label3D = new THREE.Group();
            label3D.add(new THREE.Mesh(SharedPlaneGeo, SharedTextMat));
            label3D.position.y = 1.5; 
            newWrapper.add(label3D); 
            viewer3D.labelGroup = label3D;
            
            viewer3D.activeWrapper = newWrapper;

            jumpHologramPosition();
            
            const flyDist = 25;
            viewer3D.scene.add(newWrapper);
            newWrapper.position.y = direction === 'up' ? -flyDist : flyDist; 
            newWrapper.scale.set(0.1, 0.1, 0.1);
            new TWEEN.Tween(newWrapper.position).to({ y: 0 }, 400).easing(TWEEN.Easing.Back.Out).start();
            new TWEEN.Tween(newWrapper.scale).to({ x: 1, y: 1, z: 1 }, 400).easing(TWEEN.Easing.Back.Out).onComplete(() => {
                if (viewer3D.controls) viewer3D.controls.enabled = true;
            }).start();

            if (!window.GlobalModelCache[partName]) {
                const uuid = await fetchCloudModelId(partName);
                if (session !== viewer3D.currentSession) return;
                if (uuid) {
                    const CDN = 'https://a.unity.cn/client_api/v1/buckets/181aa46a-4b2b-41d9-9765-38454415dee3/content/简模/';
                    let raw = null;
                    try { 
                        await new Promise(resolve => setTimeout(resolve, 50)); 
                        raw = await loadModelAsset(`${CDN}${uuid}.obj`, 'obj'); 
                    } catch(e1) { 
                        try { 
                            await new Promise(resolve => setTimeout(resolve, 50)); 
                            raw = await loadModelAsset(`${CDN}${uuid}.fbx`, 'fbx'); 
                        } catch(e2) {} 
                    }
                    if (session !== viewer3D.currentSession) return;
                    if (raw) window.GlobalModelCache[partName] = processRawModel(raw, partName);
                }
            }

            if (session !== viewer3D.currentSession) return;

            let loadedMesh = null;
            if (window.GlobalModelCache[partName]) {
                loadedMesh = window.GlobalModelCache[partName].clone();
            } else { 
                loadedMesh = new THREE.Mesh(SharedBoxGeo, SharedBoxMat); 
            }
            
            physicalModel.add(loadedMesh);
            const box = new THREE.Box3().setFromObject(loadedMesh); 
            let maxY = 1.0; 
            if (isFinite(box.max.y) && !isNaN(box.max.y)) maxY = box.max.y;

            new TWEEN.Tween(label3D.position).to({ y: maxY + 1.2 }, 400).easing(TWEEN.Easing.Cubic.Out).start();

            const targetScale = loadedMesh.scale.clone(); 
            
            loadedMesh.scale.setScalar(0.001);
            new TWEEN.Tween(loadedMesh.scale)
                .to({ x: targetScale.x, y: targetScale.y, z: targetScale.z }, 600)
                .easing(TWEEN.Easing.Elastic.Out)
                .start();

            if (session === viewer3D.currentSession) {
                loaderUi.classList.add('hidden');
            }
        }

        function update3DQuantity(qty, isShortage) {
            if (viewer3D.activeWrapper && viewer3D.labelGroup && typeof TWEEN !== 'undefined') {
                updateVolumetricText(`${viewer3D.currentPart}  x  ${qty}`, isShortage);
                viewer3D.labelGroup.scale.setScalar(0.6); 
                new TWEEN.Tween(viewer3D.labelGroup.scale).to({ x: 1, y: 1, z: 1 }, 600).easing(TWEEN.Easing.Elastic.Out).start();
            }
        }

        // ================= 2D Map Control =================
        const mapState = { viewBox: { x: -40, y: -50, w: 340, h: 1080 }, isDragging: false, lastX: 0, lastY: 0, startX: 0, startY: 0, needsFocus: true, clickTarget: null };

        function mapZoom(dir) {
            const zoom = dir > 0 ? 0.75 : 1.33; 
            const cx = mapState.viewBox.x + mapState.viewBox.w / 2; 
            const cy = mapState.viewBox.y + mapState.viewBox.h / 2;
            mapState.viewBox.w *= zoom; 
            mapState.viewBox.h *= zoom; 
            mapState.viewBox.x = cx - mapState.viewBox.w / 2; 
            mapState.viewBox.y = cy - mapState.viewBox.h / 2;
            const svgEl = document.querySelector('#map-container svg');
            if(svgEl) { 
                svgEl.style.transition = 'viewBox 0.5s cubic-bezier(0.16, 1, 0.3, 1)'; 
                svgEl.setAttribute('viewBox', `${mapState.viewBox.x} ${mapState.viewBox.y} ${mapState.viewBox.w} ${mapState.viewBox.h}`); 
            }
        }

        function mapFocusCurrent() { 
            mapState.needsFocus = true; 
            renderMap(); 
        }

        function renderMap() {
            const container = document.getElementById('map-container'); if(!container) return;
            const toSvg = (x, y) => ({ cx: x * 30 + 60, cy: y * 30 + 20 });
            let pathSvg = '', activeTargets = [], cx = 130, cy = 500, hasTarget = false;
            
            const uniqueCabVisits = [];
            if (state.pickingTasks.length > 0) state.pickingTasks.forEach(t => { if (!uniqueCabVisits.includes(t.cabinetId)) uniqueCabVisits.push(t.cabinetId); });
            
            let currentCabIdx = -1;
            if (state.isGuiding && uniqueCabVisits.length > 0) {
                const currentTask = state.pickingTasks[state.currentTaskIndex]; const currentCabId = currentTask ? currentTask.cabinetId : null;
                currentCabIdx = uniqueCabVisits.indexOf(currentCabId); if (currentCabIdx === -1) currentCabIdx = 0;

                for (let i = 0; i < uniqueCabVisits.length; i++) {
                    const pCab = i === 0 ? null : CABINETS.find(c => c.id === uniqueCabVisits[i-1]); const cCab = CABINETS.find(c => c.id === uniqueCabVisits[i]);
                    if (!cCab) continue;
                    let startPoint = i === 0 ? toSvg(ENTRANCE.x, ENTRANCE.y) : toSvg(pCab.x > 2 ? pCab.x - 1 : pCab.x + 1, pCab.y);
                    let endPoint = toSvg(cCab.x > 2 ? cCab.x - 1 : cCab.x + 1, cCab.y);
                    const m1 = toSvg(2, i === 0 ? ENTRANCE.y : pCab.y); const m2 = toSvg(2, cCab.y);

                    let strokeColor = "#cbd5e1", strokeWidth = "2.5", strokeDash = "6 6", isCurrent = false;
                    if (i < currentCabIdx) { strokeColor = "#10b981"; strokeWidth = "3.5"; strokeDash = "none"; } 
                    else if (i === currentCabIdx) { strokeColor = "#3b82f6"; strokeWidth = "4.5"; strokeDash = "8 6"; isCurrent = true; }

                    pathSvg += `<polyline points="${startPoint.cx},${startPoint.cy} ${m1.cx},${m1.cy} ${m2.cx},${m2.cy} ${endPoint.cx},${endPoint.cy}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-dasharray="${strokeDash}" ${isCurrent ? 'class="flowing-path"' : 'opacity="0.8"'} stroke-linejoin="round" stroke-linecap="round" />`;

                    if (Math.abs(m1.cy - m2.cy) > 10) {
                        const isDown = m2.cy > m1.cy; const arrowY = m1.cy + (m2.cy - m1.cy) * 0.5; const arrowX = m1.cx;
                        const arrowPath = isDown ? `M ${arrowX-4} ${arrowY-5} L ${arrowX} ${arrowY+3} L ${arrowX+4} ${arrowY-5}` : `M ${arrowX-4} ${arrowY+5} L ${arrowX} ${arrowY-3} L ${arrowX+4} ${arrowY+5}`;
                        pathSvg += `<path d="${arrowPath}" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
                    }
                }

                if (currentCabId) {
                    const currCab = CABINETS.find(c => c.id === currentCabId);
                    if (currCab) { hasTarget = true; const tPos = toSvg(currCab.x, currCab.y); cx = tPos.cx; cy = tPos.cy; activeTargets.push(currCab); const sPos = toSvg(2, currCab.y); pathSvg += `<circle cx="${sPos.cx}" cy="${sPos.cy}" r="6" fill="#3b82f6" />`; }
                }
            }

            const zSvg = (x,y,w,h,l) => { const tl=toSvg(x,y), br=toSvg(x+w,y+h); return `<rect x="${tl.cx}" y="${tl.cy}" width="${br.cx-tl.cx}" height="${br.cy-tl.cy}" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" rx="8"/><text x="${tl.cx+(br.cx-tl.cx)/2}" y="${tl.cy+(br.cy-tl.cy)/2}" font-size="14" font-weight="900" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle" letter-spacing="2" ${w<h?`transform="rotate(90, ${tl.cx+(br.cx-tl.cx)/2}, ${tl.cy+(br.cy-tl.cy)/2})"`:''}>${l}</text>`; };
            const bgSvg = `<defs><pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.5" fill="#e2e8f0"/></pattern></defs><rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#dotGrid)"/>${zSvg(-4.8,0.5,4.3,10.5,"产品设计")}${zSvg(-4.8,12.5,4.3,3,"茶水间")}${zSvg(-4.8,17.5,4.3,9,"研发二组")}${zSvg(4.5,0.5,5,28.5,"测试区域")}`;

            const cabsSvg = CABINETS.map(cab => {
                const pos = toSvg(cab.x, cab.y), w = cab.type === 'large' ? 56 : 42, h = cab.type === 'large' ? 26 : 20, isTgt = activeTargets.find(t => t.id === cab.id);
                const rA = isTgt ? `fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="drop-shadow(0 8px 16px rgba(59,130,246,0.3))"` : `fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.03))"`;
                const tA = `fill="${cab.type === 'large' ? '#ef4444' : '#64748b'}" font-weight="${isTgt?'900':'700'}" font-size="${cab.type === 'large' ? (isTgt?'14':'12') : (isTgt?'11':'10')}"`;
                
                let sequenceBadge = ''; const cabIdx = uniqueCabVisits.indexOf(cab.id);
                if (cabIdx !== -1) {
                    let badgeBg = "#94a3b8"; 
                    if (state.isGuiding) { if (cabIdx < currentCabIdx) badgeBg = "#10b981"; else if (cabIdx === currentCabIdx) badgeBg = "#3b82f6"; }
                    sequenceBadge = `<circle cx="${pos.cx + w/2 + 2}" cy="${pos.cy - h/2 - 2}" r="8" fill="${badgeBg}" stroke="#fff" stroke-width="2"/><text x="${pos.cx + w/2 + 2}" y="${pos.cy - h/2 - 2}" fill="#fff" font-size="9" font-weight="900" text-anchor="middle" dominant-baseline="central">${cabIdx + 1}</text>`;
                }
                return `${isTgt?`<rect x="${pos.cx-w/2}" y="${pos.cy-h/2}" width="${w}" height="${h}" rx="6" fill="none" stroke="#60a5fa" stroke-width="2"><animate attributeName="stroke-width" values="2; 8; 2" dur="1.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="1; 0; 0" dur="1.5s" repeatCount="indefinite"/></rect>`:''}<g class="${isTgt?'cabinet-target cursor-pointer':''}"><rect x="${pos.cx-w/2}" y="${pos.cy-h/2}" width="${w}" height="${h}" rx="6" ${rA} style="transition: all 0.4s ease;" /><text x="${pos.cx}" y="${pos.cy}" text-anchor="middle" dominant-baseline="central" pointer-events="none" ${tA}>${cab.displayId}</text>${sequenceBadge}</g>`;
            }).join('');

            let svgEl = container.querySelector('svg');
            if (!svgEl) {
                container.innerHTML = `<svg width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="touch-action:none; user-select:none;"></svg>`; 
                svgEl = container.querySelector('svg');
                
                const activePointers = new Map();
                let initialPinchDistance = null;
                let initialViewBox = null;
                let initialPinchCenter = null;

                svgEl.addEventListener('pointerdown', e => { 
                    if(state.mainView !== 'map') return; 
                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (activePointers.size === 1) {
                        mapState.isDragging = true; 
                        mapState.lastX = e.clientX; mapState.lastY = e.clientY; 
                        mapState.startX = e.clientX; mapState.startY = e.clientY; 
                        mapState.clickTarget = e.target; 
                        svgEl.setPointerCapture(e.pointerId); 
                        svgEl.style.cursor = 'grabbing'; 
                        svgEl.style.transition = 'none'; 
                    } else if (activePointers.size === 2) {
                        mapState.isDragging = false; 
                        const pts = Array.from(activePointers.values());
                        initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                        initialViewBox = { ...mapState.viewBox };
                        initialPinchCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
                        svgEl.style.transition = 'none';
                    }
                });

                svgEl.addEventListener('pointermove', e => { 
                    if(state.mainView !== 'map' || !activePointers.has(e.pointerId)) return; 
                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (activePointers.size === 1 && mapState.isDragging) {
                        const rect = svgEl.getBoundingClientRect(); 
                        mapState.viewBox.x -= (e.clientX - mapState.lastX) * (mapState.viewBox.w / rect.width); 
                        mapState.viewBox.y -= (e.clientY - mapState.lastY) * (mapState.viewBox.h / rect.height); 
                        mapState.lastX = e.clientX; mapState.lastY = e.clientY; 
                        svgEl.setAttribute('viewBox', `${mapState.viewBox.x} ${mapState.viewBox.y} ${mapState.viewBox.w} ${mapState.viewBox.h}`); 
                    } else if (activePointers.size === 2 && initialPinchDistance) {
                        const pts = Array.from(activePointers.values());
                        const currentDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                        const currentCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };

                        if (currentDistance > 0) {
                            const scale = initialPinchDistance / currentDistance;
                            const newW = initialViewBox.w * scale;
                            const newH = initialViewBox.h * scale;

                            const rect = svgEl.getBoundingClientRect();
                            const targetSvgX = initialViewBox.x + (initialPinchCenter.x - rect.left) * (initialViewBox.w / rect.width);
                            const targetSvgY = initialViewBox.y + (initialPinchCenter.y - rect.top) * (initialViewBox.h / rect.height);

                            mapState.viewBox.w = newW;
                            mapState.viewBox.h = newH;
                            mapState.viewBox.x = targetSvgX - (currentCenter.x - rect.left) * (newW / rect.width);
                            mapState.viewBox.y = targetSvgY - (currentCenter.y - rect.top) * (newH / rect.height);

                            svgEl.setAttribute('viewBox', `${mapState.viewBox.x} ${mapState.viewBox.y} ${mapState.viewBox.w} ${mapState.viewBox.h}`);
                        }
                    }
                });

                const handlePointerUp = e => {
                    if(state.mainView !== 'map') return; 
                    activePointers.delete(e.pointerId);

                    if (activePointers.size === 0) {
                        mapState.isDragging = false; 
                        initialPinchDistance = null;
                        svgEl.releasePointerCapture(e.pointerId); 
                        svgEl.style.cursor = 'grab'; 
                        svgEl.style.transition = 'viewBox 0.5s cubic-bezier(0.16,1,0.3,1)'; 
                        if(Math.abs(e.clientX - mapState.startX) < 5 && Math.abs(e.clientY - mapState.startY) < 5 && mapState.clickTarget?.closest('.cabinet-target')) switchMainView('cabinet'); 
                        mapState.clickTarget = null; 
                    } else if (activePointers.size === 1) {
                        initialPinchDistance = null;
                        const remaining = Array.from(activePointers.values())[0];
                        mapState.lastX = remaining.x;
                        mapState.lastY = remaining.y;
                        mapState.isDragging = true;
                    }
                };

                svgEl.addEventListener('pointerup', handlePointerUp);
                svgEl.addEventListener('pointercancel', handlePointerUp);
                svgEl.addEventListener('pointerleave', handlePointerUp);

                svgEl.addEventListener('wheel', e => {
                    if (state.mainView !== 'map') return;
                    e.preventDefault();
                    
                    const rect = svgEl.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const svgX = mapState.viewBox.x + mouseX * (mapState.viewBox.w / rect.width);
                    const svgY = mapState.viewBox.y + mouseY * (mapState.viewBox.h / rect.height);

                    const zoomFactor = e.deltaY > 0 ? 1.15 : (1 / 1.15);
                    mapState.viewBox.w *= zoomFactor;
                    mapState.viewBox.h *= zoomFactor;

                    mapState.viewBox.x = svgX - mouseX * (mapState.viewBox.w / rect.width);
                    mapState.viewBox.y = svgY - mouseY * (mapState.viewBox.h / rect.height);

                    svgEl.style.transition = 'viewBox 0.1s linear';
                    svgEl.setAttribute('viewBox', `${mapState.viewBox.x} ${mapState.viewBox.y} ${mapState.viewBox.w} ${mapState.viewBox.h}`);
                }, { passive: false });
            }
            svgEl.innerHTML = `${bgSvg}${pathSvg}${cabsSvg}`;
            
            if (state.mainView === 'map') {
                svgEl.style.pointerEvents = 'auto'; svgEl.style.cursor = 'grab';
                if (mapState.needsFocus) {
                    const rect = container.getBoundingClientRect(); mapState.viewBox.w = 550; mapState.viewBox.h = 550 * (rect.height / (rect.width || 1));
                    const isMobile = window.innerWidth < 768;
                    const visualOffsetX = (state.sidebarOpen && !isMobile) ? (mapState.viewBox.w * 160 / (window.innerWidth || 1)) : 0;
                    mapState.viewBox.x = (hasTarget?cx:130) - mapState.viewBox.w/2 - visualOffsetX; 
                    mapState.viewBox.y = (hasTarget?cy:500) - mapState.viewBox.h/2 - mapState.viewBox.h*0.05; 
                    
                    mapState.needsFocus = false; svgEl.style.transition = 'viewBox 0.7s cubic-bezier(0.16,1,0.3,1)';
                }
                requestAnimationFrame(() => svgEl.setAttribute('viewBox', `${mapState.viewBox.x} ${mapState.viewBox.y} ${mapState.viewBox.w} ${mapState.viewBox.h}`));
            } else { svgEl.style.pointerEvents = 'none'; svgEl.setAttribute('viewBox', `-40 -50 340 1080`); }
        }

        async function submitJobReport() {
            const API_ENDPOINT = 'https://stateless.unity.cn/release/2e87e2f7-8488-4b42-9a17-a4dce04e1ec3/CloudPath';
            const payloads = [];
            
            const hasVariance = state.pickingTasks.some(t => t.quantity !== t.originalQuantity);

            if (state.queryID && state.queryID !== '无' && hasVariance) {
                const updatedList = state.pickingTasks.map(t => {
                    if (t.rawPartObj) {
                        const updatedObj = { ...t.rawPartObj };
                        if ('用量' in updatedObj) updatedObj['用量'] = t.quantity;
                        else if ('数量' in updatedObj) updatedObj['数量'] = t.quantity;
                        else if ('qty' in updatedObj) updatedObj['qty'] = t.quantity;
                        else updatedObj['用量'] = t.quantity; 
                        return updatedObj;
                    }
                    return { "启蒙件名称": t.partName, "用量": t.quantity };
                });

                payloads.push({
                    action: 'updateRecord',
                    BitableUUID: 'BitableUUID084',
                    filter: {
                        conjunction: "and",
                        conditions: [{ field_name: "ID", operator: "is", value: [state.queryID] }]
                    },
                    fields: { "颗粒列表": JSON.stringify(updatedList) }
                });
            }

            payloads.push({
                action: 'addRecord',
                BitableUUID: 'BitableUUID085',
                fields: {
                    "任务描述": `${state.drawingName || '图纸1'} ID:${state.queryID || '无'}`,
                    "完成情况": "",
                    "类型": "捡积木归档"
                }
            });

            const shortageTasks = state.pickingTasks.filter(t => t.isShortage);
            if (shortageTasks.length > 0) {
                const shortageNames = shortageTasks.map(t => t.partName).join('，');
                
                payloads.push({
                    action: 'addRecord',
                    BitableUUID: 'BitableUUID085',
                    fields: {
                        "任务描述": `缺件【${shortageNames}】`,
                        "完成情况": "",
                        "类型": "缺件提示"
                    }
                });

                payloads.push({
                    action: 'addRecord',
                    BitableUUID: 'BitableUUID085',
                    fields: {
                        "任务描述": `补仓【${shortageNames}】`,
                        "完成情况": "",
                        "类型": "补仓"
                    }
                });
            }

            const promises = payloads.map(payload => 
                fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(res => res.json())
            );

            const results = await Promise.all(promises);
            
            const failedResult = results.find(r => r.code !== 0 && r.code !== undefined);
            if (failedResult) {
                console.error("数据提交失败:", failedResult);
                throw new Error(failedResult.msg || "接口响应错误"); 
            }
        }
