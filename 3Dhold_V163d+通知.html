            try {
                btn.disabled = true;
                btn.classList.add('opacity-80');
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 云端归档同步中...`;
                if (window.lucide) lucide.createIcons();

                await submitJobReport();

                closeLogAndReset(); 
                setTimeout(() => showToast("作业归档与云端同步已完成！系统已重置"), 600); 

            } catch(e) {
                showToast("归档失败：" + e.message, true);
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                btn.innerHTML = originalHTML;
                if (window.lucide) lucide.createIcons();
            }
        }

        function closeLogAndReset() {
            const o = document.getElementById('job-log-overlay'), m = document.getElementById('job-log-modal');
            o.classList.add('opacity-0'); m.classList.add('scale-95');
            setTimeout(() => {
                o.classList.add('hidden'); 
                document.getElementById('map-container').classList.remove('blur-lg');
                
                const btnArchive = document.getElementById('btn-archive');
                if (btnArchive) {
                    btnArchive.disabled = false;
                    btnArchive.classList.remove('opacity-80');
                    btnArchive.innerHTML = `<i data-lucide="archive" class="w-5 h-5"></i> 完成归档`;
                }

                state.pickingTasks = []; 
                state.currentTaskIndex = -1; 
                state.isGuiding = false; 
                state.mainView = 'map';
                state.jobStartTime = null; 
                state.sidebarOpen = false; 
                state.isAnimating = false; 
                state.currentCabinetId = null;
                state.queryID = null;
                state.drawingName = '未知图纸';
                
                if (viewer3D.activeWrapper && viewer3D.scene) {
                    viewer3D.scene.remove(viewer3D.activeWrapper);
                }
                viewer3D.activeWrapper = null;
                viewer3D.currentPart = null;

                for (const key in window.GlobalModelCache) {
                    const obj = window.GlobalModelCache[key];
                    if (obj) {
                        obj.traverse(child => {
                            if (child.isMesh) {
                                if (child.geometry) child.geometry.dispose();
                                if (child.material) {
                                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                                    else child.material.dispose();
                                }
                            }
                        });
                    }
                }
                
                window.GlobalModelCache = {};
                window.GlobalModelIdCache = {};

                document.getElementById('start-job-overlay').classList.add('hidden'); 
                document.getElementById('preload-panel').classList.add('translate-y-4', 'opacity-0');
                
                const btn = document.getElementById('btn-preload');
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'bg-white/50', 'text-emerald-600', 'border-white');
                btn.classList.add('bg-white/50', 'text-brand-600', 'border-white', 'hover:-translate-y-0.5');
                btn.innerHTML = `<i data-lucide="cloud-download" class="w-4 h-4"></i> 开始预加载所有模型，拒绝卡顿`;
                
                document.getElementById('preload-progress-bar').style.width = '0%';
                document.getElementById('preload-status-text').innerText = '0 / 0';
                
                document.getElementById('excel-upload').value = '';
                
                document.getElementById('empty-state-overlay').classList.remove('hidden');
                switchMainView('map'); updateUI('none');
            }, 500);
        }

        function startGuidance() { 
            if(state.pickingTasks.length){ 
                state.pickingTasks.sort((a,b)=>{const [tA,nA]=a.cabinetId.split('-'),[tB,nB]=b.cabinetId.split('-'); if(tA!==tB)return tA==='S'?-1:1; return parseInt(nA)-parseInt(nB);});
                state.isGuiding = true; state.jobStartTime = new Date(); 
                
                document.getElementById('start-job-overlay').classList.add('hidden');
                
                switchMainView('cabinet'); goToTask(0);
                setTimeout(()=>document.getElementById('task-list-container').scrollTo({top:0,behavior:'smooth'}), 100); 
            } 
        }

       function goToTask(targetIndex) {
            if (state.isAnimating || targetIndex === state.currentTaskIndex || targetIndex < 0) return;
            if (targetIndex >= state.pickingTasks.length) { showJobLog(); return; }

            const nextT = state.pickingTasks[targetIndex]; if (!nextT) return;
            const isSameCab = state.currentCabinetId === nextT.cabinetId, dir = targetIndex > state.currentTaskIndex ? 'up' : 'down';
            state.isAnimating = true; state.currentTaskIndex = targetIndex; state.currentCabinetId = nextT.cabinetId; 
            
            updateUI(dir);

            if (isSameCab) {
                if (nextT.cabinetId === '未分配') {
                    // 核心修改：如果是连续两个未分配的颗粒，只需要重绘 UI 即可，防止执行连线导致报错
                    renderCabinetGridFull('current', targetIndex);
                } else {
                    const cabEl = document.getElementById('swipe-layer-current')?.querySelector('.cabinet-grid');
                    if(cabEl) { 
                        const cab = CABINETS.find(c=>c.id===nextT.cabinetId);
                        cabEl.innerHTML = generateGridHTML(cab, targetIndex); 
                        renderNavPath('current', targetIndex); 
                        if (window.lucide) lucide.createIcons(); 
                    }
                }
                setTimeout(()=>document.getElementById('task-list-container').querySelector('#active-task-item')?.scrollIntoView({behavior:'smooth',block:'center'}), 100);
                state.isAnimating = false;
            } else {
                const curL = document.getElementById('swipe-layer-current'), nexL = document.getElementById('swipe-layer-next');
                renderCabinetGridFull('next', targetIndex); nexL.classList.remove('hidden');
                
                curL.style.transition = 'transform 0.5s cubic-bezier(0.55, 0.085, 0.68, 0.53), opacity 0.5s ease-in';
                curL.style.transform = dir === 'up' ? 'translateY(-60%)' : 'translateY(60%)'; curL.style.opacity = '0';
                nexL.style.transition = 'none'; nexL.style.transform = dir === 'up' ? 'translateY(60%)' : 'translateY(-60%)'; nexL.style.opacity = '0';
                
                setTimeout(() => {
                    nexL.style.transition = 'transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease-out';
                    nexL.style.transform = 'translateY(0)'; nexL.style.opacity = '1';
                    
                    setTimeout(() => {
                        curL.style.transition = 'none'; curL.innerHTML = nexL.innerHTML; curL.style.transform = 'translateY(0)'; curL.style.opacity = '1';
                        nexL.classList.add('hidden');
                        document.getElementById('task-list-container').querySelector('#active-task-item')?.scrollIntoView({behavior:'smooth',block:'center'});
                        state.isAnimating = false; renderNavPath('current', state.currentTaskIndex);
                    }, 700); 
                }, 450); 
            }
        }

        function nextGuidanceStep() { goToTask(state.currentTaskIndex + 1); }
        function prevGuidanceStep() { goToTask(state.currentTaskIndex - 1); }

   function adjustCabinetWallPosition() {
            const nextLayer = document.getElementById('swipe-layer-next');
            const activeCell = (nextLayer && !nextLayer.classList.contains('hidden')) ? nextLayer.querySelector('.grid-cell.active') : document.querySelector('#swipe-layer-current .grid-cell.active');
            
            // 核心修改：如果没有活动的格子（例如未分配库位的颗粒），将墙面平滑归位到中央
            if (!activeCell) {
                targetWallOffsetY = 0; 
                targetWallOffsetX = 0; 
                return;
            }
            
            const cabGrid = activeCell.closest('.cabinet-grid'); if(!cabGrid) return;

            const relativeX = (activeCell.offsetLeft + activeCell.offsetWidth / 2) / cabGrid.offsetWidth;
            const relativeY = (activeCell.offsetTop + activeCell.offsetHeight / 2) / cabGrid.offsetHeight;
            const isMobile = window.innerWidth < 768;
            
            const panRangeY = isMobile ? 80 : 60; 
            const baseOffsetY = isMobile ? -8 : -5; 
            targetWallOffsetY = (0.5 - relativeY) * panRangeY + baseOffsetY; 
            
            const panRangeX = isMobile ? 65 : 40; 
            targetWallOffsetX = (0.5 - relativeX) * panRangeX; 
        }

        function jumpHologramPosition() {
            const nextLayer = document.getElementById('swipe-layer-next');
            const activeCell = (nextLayer && !nextLayer.classList.contains('hidden')) ? nextLayer.querySelector('.grid-cell.active') : document.querySelector('#swipe-layer-current .grid-cell.active');
            
            const holoEl = document.getElementById('layer2-3d-hologram');
            if (!holoEl) return;
            
            const viewW = window.innerWidth;
            const isMobile = viewW < 768;

            // 核心修改：如果是未分配的颗粒，将 3D 模型平滑移动到画面正中央，并放大展示
            if (!activeCell) {
                holoEl.style.transition = 'none';
                holoEl.style.setProperty('--ui-x', `0px`);
                holoEl.style.setProperty('--ui-y', isMobile ? '-10vh' : '0px');
                holoEl.style.setProperty('--anim-scale', isMobile ? '0.8' : '1.2');
                
                void holoEl.offsetWidth; 
                holoEl.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out';
                return;
            }

            const cabGrid = activeCell.closest('.cabinet-grid'); if(!cabGrid) return;

            const relativeX = (activeCell.offsetLeft + activeCell.offsetWidth / 2) / cabGrid.offsetWidth;
            const relativeY = (activeCell.offsetTop + activeCell.offsetHeight / 2) / cabGrid.offsetHeight;
            
            let targetX = 0;
            let targetY = 0;
            
            if (isMobile) {
                targetX = relativeX < 0.5 ? (viewW * 0.15) : (-viewW * 0.15);
                targetY = -window.innerHeight * 0.05; 
                holoEl.style.setProperty('--anim-scale', '0.65');
            } else {
                targetX = relativeX < 0.5 ? (viewW * 0.22) : (-viewW * 0.22);
                targetY = 0;
                holoEl.style.setProperty('--anim-scale', '1');
            }
            
            holoEl.style.transition = 'none';
            holoEl.style.setProperty('--ui-x', `${targetX}px`);
            holoEl.style.setProperty('--ui-y', `${targetY}px`);
            
            void holoEl.offsetWidth; 
            
            holoEl.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out';
        }

        function setupInteractions() {
            const view3D = document.getElementById('view-3d-picking');
            
            const handleParallax = (clientX, clientY) => {
                if (state.mainView !== 'cabinet') return;
                const rx = (clientX / window.innerWidth - 0.5) * 2; 
                const ry = (clientY / window.innerHeight - 0.5) * 2;
                
                targetWallRotY = Math.max(-35, Math.min(0, -18 + rx * 25));
                targetWallRotX = Math.max(-5, Math.min(25, 8 - ry * 20)); 
            };

            window.addEventListener('mousemove', e => handleParallax(e.clientX, e.clientY));

            const preventCheck = (e) => e.target.closest('button') || e.target.closest('#main-sidebar') || e.target.closest('#cabinet-pipeline');

            let touchStartY = 0, touchStartX = 0, touchStartTime = 0;
            let isTouchingModelZone = false;
            
            view3D.addEventListener('touchstart', e => { 
                touchStartY = e.touches[0].clientY; 
                touchStartX = e.touches[0].clientX; 
                touchStartTime = Date.now();
                handleParallax(touchStartX, touchStartY); 
                
                const visualRing = document.getElementById('visual-holo-ring');
                if (visualRing) {
                    const rect = visualRing.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    
                    const radius = (rect.width / 2) * 1.8;
                    const distSq = Math.pow(touchStartX - centerX, 2) + Math.pow(touchStartY - centerY, 2);
                    
                    if (distSq <= radius * radius) {
                        isTouchingModelZone = true;
                        if(viewer3D.controls) viewer3D.controls.enabled = true;
                    } else {
                        isTouchingModelZone = false;
                        if(viewer3D.controls) viewer3D.controls.enabled = false;
                    }
                } else {
                    isTouchingModelZone = false;
                }
            }, {passive: true});

            view3D.addEventListener('touchmove', e => {
                if (state.mainView === 'cabinet') {
                    handleParallax(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive: true});
            
            view3D.addEventListener('touchend', e => {
                if(viewer3D.controls) viewer3D.controls.enabled = true;

                if(state.mainView !== 'cabinet' || preventCheck(e)) return; 
                
                const touchEndY = e.changedTouches[0].clientY;
                const touchEndX = e.changedTouches[0].clientX;
                const dy = touchStartY - touchEndY; 
                const dx = touchStartX - touchEndX;
                const absDy = Math.abs(dy);
                const absDx = Math.abs(dx);
                const dt = Date.now() - touchStartTime;

                let isSwipe = false;
                let isSwipeUp = false;

                if (isTouchingModelZone) {
                    if (dt < 350 && absDy > 60 && absDy > absDx * 2) { 
                        isSwipe = true;
                        isSwipeUp = dy > 0;
                    }
                } else {
                    if (dt < 600 && absDy > 40 && absDy > absDx * 1.2) { 
                        isSwipe = true;
                        isSwipeUp = dy > 0;
                    }
                }

                if (isSwipe) {
                    if (isSwipeUp) nextGuidanceStep(); 
                    else prevGuidanceStep(); 
                }
            }, {passive: true});
        }

     function initApp() {
            if (viewer3D.scene) return; 
            initThreeGlobals(); 
            init3DPartViewer(); 
            setupInteractions(); 
            setupSidebarGestures(); 
            
            if (window.lucide) lucide.createIcons();
            const tweenUpdate = (time) => { requestAnimationFrame(tweenUpdate); if (typeof TWEEN !== 'undefined') TWEEN.update(time); };
            tweenUpdate();

            // 在外部依赖均加载完成后，根据 URL 参数判定初始流
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('ID')) {
                fetchRecordFromURL();
            } else {
                renderMap(); // 没有 ID 时，静默渲染空状态地图
            }
        }

        window.addEventListener('WMSDepsLoaded', () => {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }
        });

        setTimeout(() => {
            if (!viewer3D.scene) initApp();
        }, 3000);

    </script>
